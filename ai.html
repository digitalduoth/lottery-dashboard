<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Analysis</title>

<style>
body{
  margin:0;
  font-family: system-ui;
  background:#020617;
  color:#e2e8f0;
}

/* ===== HEADER ===== */
.header{
  padding:30px;
}

.title{
  font-size:42px;
  font-weight:800;
}

/* ===== BUTTON ===== */
.btn{
  padding:12px 18px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  color:#fff;
  font-weight:600;
}

.btn.primary{
  background:linear-gradient(135deg,#9333ea,#c084fc);
}

.btn.run{
  background:linear-gradient(135deg,#5b21b6,#7c3aed);
}

.btn.green{
  background:linear-gradient(135deg,#059669,#22c55e);
}

.btn.gray{
  background:#1e293b;
}

/* ===== CARD ===== */
.card{
  background:rgba(30,41,59,0.4);
  border-radius:16px;
  padding:20px;
  margin:20px;
}

/* ===== GRID ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;
}

/* ===== NUMBER CARD ===== */
.num-card{
  background:#0f172a;
  border-radius:16px;
  padding:18px;
}

.rank{
  font-size:12px;
  opacity:.6;
}

.num{
  font-size:32px;
  font-weight:800;
  margin:6px 0;
}

.percent{
  font-size:14px;
  color:#38bdf8;
}

.sub{
  font-size:12px;
  opacity:.6;
}

/* ===== CHIP ===== */
.chip{
  display:inline-block;
  padding:8px 14px;
  border-radius:999px;
  margin:6px;
  font-size:14px;
}

/* บน */
.chip.top{
  background:rgba(250,204,21,0.15);
  color:#facc15;
}

/* ล่าง */
.chip.bottom{
  background:rgba(244,114,182,0.15);
  color:#f472b6;
}

/* Hybrid */
.chip.hybrid{
  background:rgba(139,92,246,0.15);
  color:#a78bfa;
}

/* ===== BAR ===== */
.bar{
  height:10px;
  border-radius:999px;
  background:#1e293b;
  overflow:hidden;
  margin:8px 0;
}

.bar-inner{
  height:100%;
  background:linear-gradient(90deg,#22d3ee,#a855f7);
}
</style>
</head>

<body>

<div class="header">
  <div class="title">AI Analysis</div>

  <div style="margin-top:16px;">
    <button class="btn gray">← Landing</button>
    <button class="btn primary">🎲 Lucky Drop</button>
    <button class="btn gray">Refresh</button>
    <button class="btn run">Run AI</button>
    <button class="btn green">Auto Generate</button>
  </div>
</div>

<!-- ===== TOP NUMBERS ===== -->
<div class="card">
  <h3>เลข 2 ตัวเด่น</h3>
  <div class="grid">

    <div class="num-card">
      <div class="rank">#1</div>
      <div class="num">06</div>
      <div class="percent">88.53%</div>
      <div class="sub">ออก 5 ครั้ง</div>
    </div>

    <div class="num-card">
      <div class="rank">#2</div>
      <div class="num">61</div>
      <div class="percent">80.94%</div>
      <div class="sub">ออก 4 ครั้ง</div>
    </div>

  </div>
</div>

<!-- ===== TOP 3 ===== -->
<div class="card">
  <h3>3 ตัวบน</h3>

  <div class="chip top">#1 449 • 70.6%</div>
  <div class="chip top">#2 602 • 68%</div>
  <div class="chip top">#3 299 • 66.7%</div>

</div>

<!-- ===== BOTTOM 3 ===== -->
<div class="card">
  <h3>3 ตัวล่าง</h3>

  <div class="chip bottom">#1 449 • 83.1%</div>
  <div class="chip bottom">#2 299 • 71.5%</div>
  <div class="chip bottom">#3 578 • 71.4%</div>

</div>

<!-- ===== HYBRID ===== -->
<div class="card">
  <h3>Hybrid AI</h3>

  <div class="chip hybrid">Hybrid #1 449 • 83.12%</div>
  <div class="chip hybrid">Hybrid #2 299 • 71.52%</div>
  <div class="chip hybrid">Hybrid #3 578 • 71.46%</div>

</div>

<!-- ===== BAR ===== -->
<div class="card">
  <h3>Top 10</h3>

  <div>449 - 70.6%</div>
  <div class="bar"><div class="bar-inner" style="width:70%"></div></div>

  <div>602 - 68%</div>
  <div class="bar"><div class="bar-inner" style="width:68%"></div></div>

</div>

</body>
</html>
