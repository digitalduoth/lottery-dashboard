<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engine Test</title>
  <style>
    :root{
      --bg:#0a0d14;
      --panel:#121826;
      --panel2:#0f1522;
      --line:rgba(255,255,255,.08);
      --text:#f7fbff;
      --muted:rgba(255,255,255,.68);
      --good:#8ef0b1;
      --warn:#ffd66b;
      --bad:#ff9d9d;
    }
    *{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,sans-serif}
    body{
      margin:0;
      background:linear-gradient(180deg,#070a12,#0b1220);
      color:var(--text);
      padding:16px;
    }
    .wrap{max-width:1100px;margin:0 auto}
    .card{
      background:linear-gradient(180deg,var(--panel),var(--panel2));
      border:1px solid var(--line);
      border-radius:18px;
      padding:16px;
      margin-bottom:14px;
    }
    h1,h2{margin:0 0 10px}
    h1{font-size:32px}
    h2{font-size:20px}
    .muted{color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .triple{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .mono{
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      white-space:pre-wrap;
      line-height:1.6;
      font-size:13px;
    }
    .pill{
      display:inline-block;
      padding:6px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid var(--line);
      margin:0 8px 8px 0;
      font-size:13px;
      font-weight:700;
    }
    button{
      border:none;
      background:linear-gradient(180deg,#8ab1ff,#6d79ff);
      color:#07101e;
      font-weight:800;
      border-radius:12px;
      padding:12px 16px;
      cursor:pointer;
    }
    .status{
      margin-top:12px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      font-size:13px;
      white-space:pre-wrap;
      line-height:1.6;
    }
    @media (max-width:800px){
      .grid,.triple{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Engine Test</h1>
      <div class="muted">หน้า debug เพื่อตรวจว่าสูตรยังมั่วไหม ก่อนเอากลับเข้า AI หลัก</div>
      <div style="margin-top:12px">
        <button id="runBtn" type="button">Run Engine Test</button>
      </div>
      <div id="statusBox" class="status">STATUS: HTML LOADED</div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>Latest Draw</h2>
        <div id="latestBox" class="mono">-</div>
      </div>
      <div class="card">
        <h2>Sanity Check</h2>
        <div id="sanityBox" class="mono">-</div>
      </div>
    </div>

    <div class="triple">
      <div class="card">
        <h2>Top 10 — 2 ตัว</h2>
        <div id="top2Box" class="mono">-</div>
      </div>
      <div class="card">
        <h2>Top 10 — 3 ตัวบน</h2>
        <div id="top3Box" class="mono">-</div>
      </div>
      <div class="card">
        <h2>Top 10 — 3 ตัวล่าง</h2>
        <div id="bottom3Box" class="mono">-</div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>Model Reasons</h2>
        <div id="reasonsBox" class="mono">-</div>
      </div>
      <div class="card">
        <h2>Backtest</h2>
        <div id="backtestBox" class="mono">-</div>
      </div>
    </div>

    <div class="card">
      <h2>Regime</h2>
      <div id="regimeBox"></div>
    </div>
  </div>

  <script>
    (function () {
      var DATA_URL = "https://digitalduoth.github.io/lottery-dashboard/data.json?v=" + Date.now();

      var CONFIG = {
        minHistory: 12,
        backtestRounds: 20,
        take: 10,
        weights: {
          antiRepeat: 0.42,
          deltaShift: 0.24,
          gap: 0.19,
          novelty: 0.15
        }
      };

      function el(id) {
        return document.getElementById(id);
      }

      function setStatus(text, color) {
        var box = el("statusBox");
        box.textContent = text;
        box.style.color = color || "var(--text)";
      }

      function showFatal(message) {
        setStatus("STATUS: ERROR\n" + message, "var(--bad)");
        el("latestBox").textContent = message;
        el("sanityBox").textContent = message;
        el("top2Box").textContent = message;
        el("top3Box").textContent = message;
        el("bottom3Box").textContent = message;
        el("reasonsBox").textContent = message;
        el("backtestBox").textContent = message;
        el("regimeBox").innerHTML = "";
      }

      setStatus("STATUS: SCRIPT STARTED", "var(--warn)");

      function safeString(v, len) {
        var s = String(v == null ? "" : v).trim();
        if (len) return s.padStart(len, "0");
        return s;
      }

      function normalizeRow(d) {
        var firstPrize = safeString(d.firstPrize || d.prize1 || d.first || "", 6);
        var top3 = safeString(d.top3 || (firstPrize ? firstPrize.slice(-3) : ""), 3);
        var last2 = safeString(d.last2 || d.bottom2 || "", 2);

        var front3 = [];
        if (Array.isArray(d.front3)) {
          front3 = d.front3.map(function (x) { return safeString(x, 3); }).slice(0, 2);
        } else if (Array.isArray(d.top3Front)) {
          front3 = d.top3Front.map(function (x) { return safeString(x, 3); }).slice(0, 2);
        }

        var bottom3 = [];
        if (Array.isArray(d.bottom3)) {
          bottom3 = d.bottom3.map(function (x) { return safeString(x, 3); }).slice(0, 2);
        } else if (Array.isArray(d.last3)) {
          bottom3 = d.last3.map(function (x) { return safeString(x, 3); }).slice(0, 2);
        }

        return {
          date: safeString(d.date),
          firstPrize: firstPrize,
          top3: top3,
          last2: last2,
          front3: front3,
          bottom3: bottom3
        };
      }

      function prepareData(data) {
        return data
          .map(normalizeRow)
          .filter(function (d) {
            return d.date &&
              d.firstPrize.length === 6 &&
              d.top3.length === 3 &&
              d.last2.length === 2 &&
              d.bottom3.length >= 1;
          })
          .sort(function (a, b) {
            return new Date(b.date) - new Date(a.date);
          });
      }

      function gen2() {
        var arr = [];
        for (var i = 0; i < 100; i++) arr.push(String(i).padStart(2, "0"));
        return arr;
      }

      function gen3() {
        var arr = [];
        for (var i = 0; i < 1000; i++) arr.push(String(i).padStart(3, "0"));
        return arr;
      }

      function top(scored, take) {
        take = take || CONFIG.take;
        var sorted = scored.slice().sort(function (a, b) { return b.score - a.score; }).slice(0, take);
        var max = sorted.length ? sorted[0].score : 1;
        var min = sorted.length ? sorted[sorted.length - 1].score : 0;
        var span = Math.max(max - min, 0.000001);

        return sorted.map(function (item) {
          return {
            num: item.num,
            score: item.score,
            parts: item.parts,
            percent: Number((42 + ((item.score - min) / span) * 58).toFixed(2))
          };
        });
      }

      function countUniqueDigits(values) {
        var s = new Set();
        values.forEach(function (v) {
          String(v).split("").forEach(function (d) { s.add(d); });
        });
        return s.size;
      }

      function calcRepeatRatio(values) {
        var repeat = 0;
        var total = 0;
        for (var i = 1; i < values.length; i++) {
          if (values[i - 1] === values[i]) repeat++;
          total++;
        }
        return total ? repeat / total : 0;
      }

      function calcOverlapRatio(values) {
        var overlap = 0;
        var total = 0;
        for (var i = 1; i < values.length; i++) {
          var a = String(values[i - 1]);
          var b = String(values[i]);
          var pool = b.split("");
          var hit = 0;

          a.split("").forEach(function (d) {
            var idx = pool.indexOf(d);
            if (idx !== -1) {
              hit++;
              pool.splice(idx, 1);
            }
          });

          overlap += hit / a.length;
          total++;
        }
        return total ? overlap / total : 0;
      }

      function detectRegime(data) {
        var short = data.slice(0, 8).map(function (x) { return x.top3; });
        var mid = data.slice(0, 24).map(function (x) { return x.top3; });

        return {
          highRepeat: calcRepeatRatio(short) >= 0.34,
          highOverlap: calcOverlapRatio(short) >= 0.62,
          spreadUp: countUniqueDigits(short) > countUniqueDigits(mid),
          spreadDown: countUniqueDigits(short) < countUniqueDigits(mid)
        };
      }

      function samePositionCount(a, b) {
        var count = 0;
        for (var i = 0; i < a.length; i++) {
          if (a[i] === b[i]) count++;
        }
        return count;
      }

      function sharedDigitsRatio(a, b) {
        var pool = b.split("");
        var hit = 0;
        a.split("").forEach(function (d) {
          var idx = pool.indexOf(d);
          if (idx !== -1) {
            hit++;
            pool.splice(idx, 1);
          }
        });
        return hit / a.length;
      }

      function antiRepeat(num, latest, digits) {
        var score = 1.0;
        if (num === latest) return -10;

        var samePos = samePositionCount(num, latest);
        var shared = sharedDigitsRatio(num, latest);

        if (samePos === digits) score -= 5.0;
        else if (samePos === digits - 1) score -= 2.4;
        else if (samePos === 1) score -= 0.7;

        if (shared === 1) score -= 2.0;
        else if (shared >= 0.66) score -= 1.1;
        else if (shared >= 0.5) score -= 0.5;

        if (digits === 3 && new Set(num.split("")).size === 1) score -= 0.8;
        if (digits === 2 && num[0] === num[1]) score -= 0.4;

        return score;
      }

      function positionProfile(values, digits) {
        var out = [];
        for (var i = 0; i < digits; i++) out.push({});

        values.forEach(function (v, idx) {
          var w = 1 / (1 + idx * 0.18);
          for (var i = 0; i < digits; i++) {
            var d = v[i];
            out[i][d] = (out[i][d] || 0) + w;
          }
        });

        return out;
      }

      function pairProfile(values, digits) {
        var out = {};
        values.forEach(function (v, idx) {
          var w = 1 / (1 + idx * 0.18);
          for (var i = 0; i < digits - 1; i++) {
            var pair = v.slice(i, i + 2);
            out[pair] = (out[pair] || 0) + w;
          }
        });
        return out;
      }

      function deltaShift(num, historyValues, digits) {
        var short = historyValues.slice(0, 8);
        var mid = historyValues.slice(0, 24);
        var long = historyValues.slice(0, 80);

        var shortPos = positionProfile(short, digits);
        var midPos = positionProfile(mid, digits);
        var longPos = positionProfile(long, digits);

        var score = 0;

        for (var i = 0; i < digits; i++) {
          var d = num[i];
          var s = shortPos[i][d] || 0;
          var m = midPos[i][d] || 0;
          var l = longPos[i][d] || 0;
          score += (s - m) + ((m - l) * 0.5);
        }

        var shortPairs = pairProfile(short, digits);
        var midPairs = pairProfile(mid, digits);

        for (var j = 0; j < digits - 1; j++) {
          var pair = num.slice(j, j + 2);
          score += ((shortPairs[pair] || 0) - (midPairs[pair] || 0)) * 0.8;
        }

        return score;
      }

      function gapScore(num, historyValues) {
        var idx = historyValues.indexOf(num);
        if (idx === 0) return -5.5;
        if (idx === 1) return -3.0;
        if (idx === 2) return -1.6;
        if (idx >= 3 && idx <= 8) return 0.25;
        if (idx >= 9 && idx <= 20) return 1.0;
        if (idx >= 21 && idx <= 40) return 0.72;
        if (idx === -1) return 0.48;
        return 0.36;
      }

      function novelty(num, historyValues) {
        var short = historyValues.slice(0, 12);
        var long = historyValues.slice(0, 60);

        var shortSet = new Set(short);
        var longSet = new Set(long);

        var score = 0;
        if (!shortSet.has(num) && longSet.has(num)) score += 0.9;
        if (!longSet.has(num)) score += 0.35;

        var unique = new Set(num.split("")).size;
        if (num.length === 2) {
          if (unique === 2) score += 0.45;
          else score -= 0.12;
        } else {
          if (unique === 3) score += 0.6;
          else if (unique === 2) score += 0.15;
          else score -= 0.35;
        }

        var mirror = num.split("").reverse().join("");
        if (mirror !== num && shortSet.has(mirror)) score += 0.28;

        return score;
      }

      function scoreAll(candidates, latest, historyValues, regime, digits) {
        return candidates.map(function (num) {
          var parts = {
            antiRepeat: antiRepeat(num, latest, digits),
            deltaShift: deltaShift(num, historyValues, digits),
            gap: gapScore(num, historyValues),
            novelty: novelty(num, historyValues)
          };

          var score =
            parts.antiRepeat * CONFIG.weights.antiRepeat +
            parts.deltaShift * CONFIG.weights.deltaShift +
            parts.gap * CONFIG.weights.gap +
            parts.novelty * CONFIG.weights.novelty;

          if (regime.highRepeat) score *= 0.88;
          if (regime.highOverlap && sharedDigitsRatio(num, latest) > 0.66) score *= 0.72;
          if (regime.spreadUp && new Set(num.split("")).size === digits) score *= 1.08;
          if (regime.spreadDown && new Set(num.split("")).size === 1) score *= 0.82;

          return { num: num, score: score, parts: parts };
        });
      }

      function runForecast(clean) {
        var latest = clean[0];
        var history = clean.slice(1);
        var regime = detectRegime(clean);

        var top2 = top(scoreAll(gen2(), latest.last2, history.map(function (x) { return x.last2; }), regime, 2));
        var top3 = top(scoreAll(gen3(), latest.top3, history.map(function (x) { return x.top3; }), regime, 3));
        var bottom3 = top(scoreAll(gen3(), latest.bottom3[0], history.flatMap(function (x) { return x.bottom3; }), regime, 3));

        return { latest: latest, regime: regime, top2: top2, top3: top3, bottom3: bottom3 };
      }

      function runBacktest(clean, rounds) {
        rounds = rounds || CONFIG.backtestRounds;
        var limit = Math.min(rounds, clean.length - 1);
        var stat = {
          strict: { last2: 0, top3: 0, bottom3: 0 },
          practical: { last2: 0, top3: 0, bottom3: 0 },
          count: 0
        };

        for (var i = 0; i < limit; i++) {
          var settled = clean[i];
          var history = clean.slice(i + 1);
          if (history.length < CONFIG.minHistory) continue;

          var regime = detectRegime(history);

          var top2 = top(scoreAll(gen2(), settled.last2, history.map(function (x) { return x.last2; }), regime, 2));
          var top3 = top(scoreAll(gen3(), settled.top3, history.map(function (x) { return x.top3; }), regime, 3));
          var bottom3 = top(scoreAll(gen3(), settled.bottom3[0], history.flatMap(function (x) { return x.bottom3; }), regime, 3));

          if (top2.slice(0, 5).some(function (x) { return x.num === settled.last2; })) stat.strict.last2++;
          if (top3.slice(0, 5).some(function (x) { return x.num === settled.top3; })) stat.strict.top3++;
          if (bottom3.slice(0, 5).some(function (x) { return settled.bottom3.includes(x.num); })) stat.strict.bottom3++;

          if (top2.slice(0, 10).some(function (x) { return x.num === settled.last2; })) stat.practical.last2++;
          if (top3.slice(0, 10).some(function (x) { return x.num === settled.top3; })) stat.practical.top3++;
          if (bottom3.slice(0, 10).some(function (x) { return settled.bottom3.includes(x.num); })) stat.practical.bottom3++;

          stat.count++;
        }

        var c = stat.count || 1;
        return {
          count: stat.count,
          strictRate: {
            last2: ((stat.strict.last2 / c) * 100).toFixed(2),
            top3: ((stat.strict.top3 / c) * 100).toFixed(2),
            bottom3: ((stat.strict.bottom3 / c) * 100).toFixed(2)
          },
          practicalRate: {
            last2: ((stat.practical.last2 / c) * 100).toFixed(2),
            top3: ((stat.practical.top3 / c) * 100).toFixed(2),
            bottom3: ((stat.practical.bottom3 / c) * 100).toFixed(2)
          }
        };
      }

      function sanityCheck(result) {
        var latest = result.latest;
        var lines = [];

        lines.push(result.top2[0] && result.top2[0].num === latest.last2
          ? "❌ 2 ตัวอันดับ 1 ซ้ำงวดล่าสุด"
          : "✅ 2 ตัวอันดับ 1 ไม่ซ้ำงวดล่าสุด");

        lines.push(result.top3[0] && result.top3[0].num === latest.top3
          ? "❌ 3 ตัวบนอันดับ 1 ซ้ำงวดล่าสุด"
          : "✅ 3 ตัวบนอันดับ 1 ไม่ซ้ำงวดล่าสุด");

        lines.push(result.bottom3[0] && latest.bottom3.includes(result.bottom3[0].num)
          ? "⚠️ 3 ตัวล่างอันดับ 1 ชนงวดล่าสุด"
          : "✅ 3 ตัวล่างอันดับ 1 ไม่ชนงวดล่าสุด");

        return lines.join("\n");
      }

      function renderTopBox(target, list) {
        target.textContent = list.map(function (x, i) {
          return String(i + 1).padStart(2, "0") + ". " + x.num + " | score=" + x.score.toFixed(4) + " | " + x.percent + "%";
        }).join("\n");
      }

      function renderReasons(target, list, title) {
        var topItem = list[0];
        if (!topItem) {
          target.textContent = "-";
          return;
        }

        target.textContent =
          title + " อันดับ 1 = " + topItem.num + "\n\n" +
          "antiRepeat = " + topItem.parts.antiRepeat.toFixed(4) + "\n" +
          "deltaShift = " + topItem.parts.deltaShift.toFixed(4) + "\n" +
          "gap = " + topItem.parts.gap.toFixed(4) + "\n" +
          "novelty = " + topItem.parts.novelty.toFixed(4) + "\n" +
          "final = " + topItem.score.toFixed(4);
      }

      function renderRegime(target, regime) {
        target.innerHTML =
          '<span class="pill">highRepeat: ' + regime.highRepeat + '</span>' +
          '<span class="pill">highOverlap: ' + regime.highOverlap + '</span>' +
          '<span class="pill">spreadUp: ' + regime.spreadUp + '</span>' +
          '<span class="pill">spreadDown: ' + regime.spreadDown + '</span>';
      }

      function fetchJson(url) {
        return fetch(url, { method: "GET", cache: "no-store" }).then(function (res) {
          if (!res.ok) throw new Error("โหลด data.json ไม่สำเร็จ (" + res.status + ")");
          return res.json();
        });
      }

      function run() {
        setStatus("STATUS: loading data...", "var(--warn)");

        return fetchJson(DATA_URL)
          .then(function (raw) {
            if (!Array.isArray(raw)) {
              throw new Error("data.json ไม่ใช่ array");
            }

            var clean = prepareData(raw);
            if (clean.length < CONFIG.minHistory + 1) {
              throw new Error("ข้อมูลย้อนหลังไม่พอ (usable=" + clean.length + ")");
            }

            var result = runForecast(clean);
            var backtest = runBacktest(clean);

            el("latestBox").textContent =
              "date: " + result.latest.date + "\n" +
              "firstPrize: " + result.latest.firstPrize + "\n" +
              "top3: " + result.latest.top3 + "\n" +
              "last2: " + result.latest.last2 + "\n" +
              "front3: " + result.latest.front3.join(", ") + "\n" +
              "bottom3: " + result.latest.bottom3.join(", ");

            el("sanityBox").textContent = sanityCheck(result);
            renderTopBox(el("top2Box"), result.top2);
            renderTopBox(el("top3Box"), result.top3);
            renderTopBox(el("bottom3Box"), result.bottom3);

            el("backtestBox").textContent =
              "ย้อนหลัง " + backtest.count + " งวด\n\n" +
              "Strict\n" +
              "- 2 ตัว: " + backtest.strictRate.last2 + "%\n" +
              "- 3 ตัวบน: " + backtest.strictRate.top3 + "%\n" +
              "- 3 ตัวล่าง: " + backtest.strictRate.bottom3 + "%\n\n" +
              "Practical\n" +
              "- 2 ตัว: " + backtest.practicalRate.last2 + "%\n" +
              "- 3 ตัวบน: " + backtest.practicalRate.top3 + "%\n" +
              "- 3 ตัวล่าง: " + backtest.practicalRate.bottom3 + "%";

            renderReasons(el("reasonsBox"), result.top3, "3 ตัวบน");
            renderRegime(el("regimeBox"), result.regime);

            setStatus(
              "STATUS: loaded OK\n" +
              "rows raw = " + raw.length + "\n" +
              "rows usable = " + clean.length + "\n" +
              "latest = " + result.latest.date,
              "var(--good)"
            );
          })
          .catch(function (err) {
            showFatal(err && err.message ? err.message : String(err));
          });
      }

      var button = el("runBtn");
      if (!button) {
        showFatal("หา runBtn ไม่เจอ");
        return;
      }

      button.addEventListener("click", function () {
        run();
      });

      setStatus("STATUS: READY - script parsed OK", "var(--good)");
      run();
    })();
  </script>
</body>
</html>
