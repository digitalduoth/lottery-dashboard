<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Drop</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root{
      --bg:#040714;
      --bg2:#090f22;
      --text:#fff8ef;
      --muted:#b9c5dc;
      --gold:#ffd86f;
      --pink:#ff4db8;
      --purple:#8b5cf6;
      --blue:#63a9ff;
      --cyan:#2de2ff;
      --orange:#ff9f43;
      --panel:rgba(16,22,42,.50);
      --line:rgba(255,255,255,.10);
      --shadow:0 30px 90px rgba(0,0,0,.42);
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:
        radial-gradient(circle at 12% 18%, rgba(99,169,255,.22), transparent 18%),
        radial-gradient(circle at 88% 16%, rgba(255,77,184,.18), transparent 20%),
        radial-gradient(circle at 50% 88%, rgba(45,226,255,.12), transparent 18%),
        linear-gradient(180deg,var(--bg),var(--bg2));
      overflow-x:hidden;
    }

    .app{
      max-width:1280px;
      margin:0 auto;
      padding:20px 16px 24px;
      min-height:100vh;
      display:grid;
      grid-template-rows:auto auto 1fr auto;
      gap:18px;
    }

    .topbar{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .brand-logo{
      width:72px;
      height:72px;
      border-radius:22px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,var(--gold),#ffb84d);
      color:#111827;
      font-size:32px;
      font-weight:900;
      box-shadow:0 14px 34px rgba(255,216,111,.22);
      flex:0 0 auto;
    }

    .kicker{
      font-size:14px;
      color:#eef4ff;
      opacity:.9;
      font-weight:900;
      letter-spacing:.02em;
      margin-bottom:4px;
    }

    h1{
      margin:0;
      font-size:clamp(44px,7vw,80px);
      line-height:.95;
      letter-spacing:-1.4px;
    }

    .sub{
      margin:10px 0 0;
      max-width:720px;
      color:var(--muted);
      font-size:15px;
      line-height:1.55;
    }

    .top-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .btn{
      border:0;
      cursor:pointer;
      border-radius:18px;
      padding:13px 18px;
      font-weight:900;
      color:white;
      text-decoration:none;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      font-size:15px;
      backdrop-filter:blur(10px);
    }

    .mode-row{
      display:grid;
      grid-template-columns:repeat(6,minmax(0,1fr));
      gap:12px;
    }

    .mode-btn{
      min-height:76px;
      border-radius:22px;
      border:1px solid rgba(255,255,255,.11);
      background:rgba(255,255,255,.05);
      color:var(--text);
      font-size:clamp(18px,2vw,26px);
      font-weight:900;
      cursor:pointer;
      transition:.18s ease;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
    }

    .mode-btn.active{
      background:linear-gradient(135deg, rgba(255,159,67,.42), rgba(255,77,184,.36));
      border-color:rgba(255,216,111,.54);
      box-shadow:
        0 0 0 2px rgba(255,216,111,.12) inset,
        0 18px 44px rgba(255,77,184,.22),
        0 0 42px rgba(255,159,67,.18);
      transform:translateY(-1px);
    }

    .hero-stage{
      position:relative;
      min-height:56vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      overflow:hidden;
      border-radius:40px;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.03), transparent 32%),
        linear-gradient(180deg, rgba(16,22,42,.22), rgba(16,22,42,.08));
      border:1px solid rgba(255,255,255,.06);
    }

    .hero-stage::before{
      content:"";
      position:absolute;
      width:380px;
      height:380px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(99,169,255,.15), transparent 70%);
      left:-120px;
      top:10%;
      pointer-events:none;
    }

    .hero-stage::after{
      content:"";
      position:absolute;
      width:420px;
      height:420px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(255,77,184,.13), transparent 70%);
      right:-150px;
      top:6%;
      pointer-events:none;
    }

    .stage-center{
      position:relative;
      z-index:2;
      width:100%;
      max-width:1100px;
      padding:20px 20px 10px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height:52vh;
    }

    .number-label{
      font-size:clamp(24px,3vw,34px);
      font-weight:900;
      color:#edf3ff;
      opacity:.95;
      margin-bottom:20px;
    }

    .number-glow{
      position:absolute;
      width:min(74vw,760px);
      height:min(34vw,260px);
      background:radial-gradient(circle, rgba(255,216,111,.16), transparent 72%);
      filter:blur(18px);
      pointer-events:none;
      z-index:1;
    }

    .result-number{
      position:relative;
      z-index:2;
      width:100%;
      text-align:center;
      line-height:1;
      font-weight:900;
      white-space:nowrap;
      font-variant-numeric:tabular-nums;
      letter-spacing:.03em;
      color:#fff8ef;
      background:linear-gradient(180deg,#fffefb,#ffe7bf 70%,#fffefb);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      text-shadow:none;
      filter:
        drop-shadow(0 4px 0 rgba(255,255,255,.05))
        drop-shadow(0 14px 26px rgba(0,0,0,.28))
        drop-shadow(0 0 18px rgba(255,216,111,.16));
      transform-origin:center center;
      transition:transform .12s ease, filter .12s ease, opacity .12s ease;
      overflow:hidden;
      padding:8px 0;
    }

    .result-number.final-pop{
      transform:scale(1.08);
      filter:
        drop-shadow(0 4px 0 rgba(255,255,255,.08))
        drop-shadow(0 16px 30px rgba(0,0,0,.34))
        drop-shadow(0 0 24px rgba(255,216,111,.24))
        drop-shadow(0 0 44px rgba(255,77,184,.12));
    }

    .result-meta{
      margin-top:18px;
      color:var(--muted);
      font-size:16px;
      font-weight:800;
    }

    .action-row{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      justify-content:center;
      align-items:center;
    }

    .spin-btn{
      border:0;
      cursor:pointer;
      border-radius:24px;
      min-height:68px;
      padding:16px 32px;
      font-size:24px;
      font-weight:900;
      color:white;
      background:linear-gradient(135deg,var(--orange),var(--pink),var(--purple));
      box-shadow:
        0 20px 44px rgba(255,77,184,.22),
        0 0 40px rgba(255,159,67,.18);
      min-width:300px;
    }

    .action-btn{
      border:1px solid rgba(255,255,255,.10);
      cursor:pointer;
      border-radius:18px;
      min-height:56px;
      padding:12px 16px;
      font-size:15px;
      font-weight:900;
      color:white;
      background:rgba(255,255,255,.07);
      min-width:132px;
      backdrop-filter:blur(8px);
    }

    .hidden-export{
      position:fixed;
      left:-99999px;
      top:0;
      z-index:-1;
    }

    @media (max-width:1080px){
      .mode-row{grid-template-columns:repeat(3,minmax(0,1fr))}
    }

    @media (max-width:700px){
      .app{padding:14px 10px 18px}
      .mode-row{grid-template-columns:repeat(2,minmax(0,1fr))}
      .spin-btn,.action-btn{width:100%}
      .action-row{justify-content:stretch}
      .hero-stage{min-height:52vh}
      .stage-center{min-height:46vh}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div>
        <div class="brand">
          <div class="brand-logo">🎲</div>
          <div>
            <div class="kicker">Random 100% • ไม่เกี่ยวกับ AI</div>
            <h1>Lucky Drop</h1>
          </div>
        </div>
        <p class="sub">
          เลือกจำนวนหลักแล้วกดสุ่มได้ทันที ใช้กับเลขนำโชค หวยไทย หวยลาว หวยฮานอย
          หรือส่งลิงก์ให้ลูกค้าเล่นแบบหน้าเดียวจบ
        </p>
      </div>

      <div class="top-actions">
        <a class="btn" href="./index.html">← กลับหน้า AI</a>
      </div>
    </div>

    <div class="mode-row">
      <button class="mode-btn" data-digit="1">1 ตัว</button>
      <button class="mode-btn active" data-digit="2">2 ตัว</button>
      <button class="mode-btn" data-digit="3">3 ตัว</button>
      <button class="mode-btn" data-digit="4">4 ตัว</button>
      <button class="mode-btn" data-digit="5">5 ตัว</button>
      <button class="mode-btn" data-digit="6">6 ตัว</button>
    </div>

    <section class="hero-stage">
      <div class="stage-center" id="captureArea">
        <div class="number-label" id="numberLabel">เลขนำโชค 2 ตัว</div>
        <div class="number-glow"></div>
        <div class="result-number" id="resultNumber">--</div>
        <div class="result-meta" id="resultMeta">กดสุ่มเพื่อเริ่ม</div>
      </div>
    </section>

    <div class="action-row">
      <button class="spin-btn" id="spinBtn">🎲 สุ่มเลย</button>
      <button class="action-btn" id="copyBtn">Copy</button>
      <button class="action-btn" id="saveStoryBtn">Save Story</button>
      <button class="action-btn" id="saveSquareBtn">Save Square</button>
      <button class="action-btn" id="shareBtn">Share</button>
      <button class="action-btn" id="lineBtn">LINE</button>
    </div>
  </div>

  <div id="exportRoot" class="hidden-export"></div>

  <script>
    const APP_NAME = "Lucky Drop";
    let selectedDigit = 2;
    let currentValue = "--";
    let isSpinning = false;

    const resultNumber = document.getElementById("resultNumber");
    const resultMeta = document.getElementById("resultMeta");
    const numberLabel = document.getElementById("numberLabel");
    const spinBtn = document.getElementById("spinBtn");

    function randomInt(maxExclusive) {
      const arr = new Uint32Array(1);
      crypto.getRandomValues(arr);
      return arr[0] % maxExclusive;
    }

    function padNumber(value, size) {
      return String(value).padStart(size, "0");
    }

    function getMaxByDigit(digit) {
      return Math.pow(10, digit);
    }

    function getFontSizePx(digit, width) {
      const rules = {
        1: Math.min(width * 0.36, 290),
        2: Math.min(width * 0.31, 250),
        3: Math.min(width * 0.25, 212),
        4: Math.min(width * 0.205, 176),
        5: Math.min(width * 0.17, 144),
        6: Math.min(width * 0.145, 124)
      };
      return rules[digit] || 100;
    }

    function updateResultFont() {
      const boxWidth = resultNumber.parentElement.clientWidth || 900;
      const size = getFontSizePx(selectedDigit, boxWidth);
      resultNumber.style.fontSize = `${size}px`;
      resultNumber.style.letterSpacing = selectedDigit >= 5 ? ".012em" : ".03em";
    }

    function updateModeUI() {
      document.querySelectorAll(".mode-btn").forEach(btn => {
        btn.classList.toggle("active", Number(btn.dataset.digit) === selectedDigit);
      });
      numberLabel.textContent = `เลขนำโชค ${selectedDigit} ตัว`;
      updateResultFont();
    }

    function rollingValue(max, digit) {
      return padNumber(randomInt(max), digit);
    }

    function setRollingVisual(scale, opacity) {
      resultNumber.style.transform = `scale(${scale})`;
      resultNumber.style.opacity = opacity;
    }

    function finalPop() {
      resultNumber.classList.add("final-pop");
      setTimeout(() => {
        resultNumber.classList.remove("final-pop");
        resultNumber.style.transform = "scale(1)";
      }, 230);
    }

    function spin() {
      if (isSpinning) return;

      isSpinning = true;
      spinBtn.disabled = true;
      spinBtn.style.opacity = ".72";

      const max = getMaxByDigit(selectedDigit);
      const finalValue = rollingValue(max, selectedDigit);

      resultMeta.textContent = "กำลังสุ่ม...";
      updateResultFont();

      let phase1 = 0;
      let phase2 = 0;
      let phase3 = 0;

      function runPhase1() {
        resultNumber.textContent = rollingValue(max, selectedDigit);
        setRollingVisual(1.05, ".92");
        phase1++;
        if (phase1 < 26) {
          setTimeout(runPhase1, 28);
        } else {
          runPhase2();
        }
      }

      function runPhase2() {
        resultNumber.textContent = rollingValue(max, selectedDigit);
        setRollingVisual(1.028, ".96");
        phase2++;
        if (phase2 < 12) {
          setTimeout(runPhase2, 56);
        } else {
          runPhase3();
        }
      }

      function runPhase3() {
        resultNumber.textContent = rollingValue(max, selectedDigit);
        setRollingVisual(1.014, ".99");
        phase3++;
        if (phase3 < 6) {
          setTimeout(runPhase3, 110 + (phase3 * 34));
        } else {
          resultNumber.textContent = finalValue;
          resultNumber.style.opacity = "1";
          resultNumber.style.transform = "scale(1)";
          currentValue = finalValue;
          resultMeta.textContent = `ตอนนี้เลือก: ${selectedDigit} ตัว`;
          finalPop();
          isSpinning = false;
          spinBtn.disabled = false;
          spinBtn.style.opacity = "1";
        }
      }

      runPhase1();
    }

    async function copyNumber() {
      if (!currentValue || currentValue === "--") {
        alert("ยังไม่มีเลขที่สุ่ม");
        return;
      }

      try {
        await navigator.clipboard.writeText(currentValue);
        alert("คัดลอกเลขแล้ว");
      } catch (error) {
        alert("คัดลอกไม่สำเร็จ");
      }
    }

    function buildExportCard(type = "story") {
      const exportRoot = document.getElementById("exportRoot");
      const isStory = type === "story";

      exportRoot.innerHTML = `
        <div id="exportCard" style="
          width:1080px;
          height:${isStory ? "1920px" : "1080px"};
          padding:${isStory ? "64px 56px" : "54px"};
          color:#fff8ef;
          font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
          background:
            radial-gradient(circle at 12% 18%, rgba(99,169,255,.22), transparent 18%),
            radial-gradient(circle at 88% 16%, rgba(255,77,184,.18), transparent 20%),
            radial-gradient(circle at 50% 88%, rgba(45,226,255,.12), transparent 18%),
            linear-gradient(180deg,#040714,#090f22);
          position:relative;
          overflow:hidden;
          display:flex;
          flex-direction:column;
          justify-content:space-between;
          border-radius:0;
        ">
          <div style="
            position:absolute;left:50%;bottom:-130px;transform:translateX(-50%);
            width:520px;height:520px;border-radius:50%;
            background:radial-gradient(circle, rgba(45,226,255,.15), transparent 70%);
            filter:blur(10px);
          "></div>

          <div style="
            position:absolute;left:-140px;top:140px;
            width:340px;height:340px;border-radius:50%;
            background:radial-gradient(circle, rgba(99,169,255,.18), transparent 70%);
          "></div>

          <div style="
            position:absolute;right:-140px;top:120px;
            width:360px;height:360px;border-radius:50%;
            background:radial-gradient(circle, rgba(255,77,184,.16), transparent 70%);
          "></div>

          <div style="position:relative;z-index:2;">
            <div style="display:flex;align-items:center;gap:16px;">
              <div style="
                width:88px;height:88px;border-radius:26px;display:grid;place-items:center;
                background:linear-gradient(135deg,#ffd86f,#ffb84d);
                color:#111827;font-size:38px;font-weight:900;
                box-shadow:0 14px 34px rgba(255,216,111,.20);
              ">🎲</div>
              <div>
                <div style="font-size:24px;color:rgba(255,255,255,.80);font-weight:900;">Random 100% • ไม่เกี่ยวกับ AI</div>
                <div style="font-size:74px;font-weight:900;line-height:1;margin-top:4px;">Lucky Drop</div>
              </div>
            </div>
          </div>

          <div style="
            position:relative;z-index:2;
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            text-align:center;
            flex:1;
            padding:${isStory ? "80px 0 70px" : "40px 0 30px"};
          ">
            <div style="
              font-size:${isStory ? "34px" : "28px"};
              color:rgba(255,255,255,.86);
              font-weight:900;
              margin-bottom:18px;
            ">เลขนำโชค ${selectedDigit} ตัว</div>

            <div style="
              position:absolute;
              width:${isStory ? "760px" : "680px"};
              height:${isStory ? "250px" : "210px"};
              border-radius:50%;
              background:radial-gradient(circle, rgba(255,216,111,.18), transparent 72%);
              filter:blur(18px);
            "></div>

            <div style="
              position:relative;
              z-index:3;
              font-weight:900;
              line-height:1;
              letter-spacing:${selectedDigit >= 5 ? ".012em" : ".03em"};
              font-size:${isStory
                ? (selectedDigit === 1 ? "330px" :
                   selectedDigit === 2 ? "290px" :
                   selectedDigit === 3 ? "245px" :
                   selectedDigit === 4 ? "205px" :
                   selectedDigit === 5 ? "170px" : "148px")
                : (selectedDigit === 1 ? "250px" :
                   selectedDigit === 2 ? "220px" :
                   selectedDigit === 3 ? "190px" :
                   selectedDigit === 4 ? "158px" :
                   selectedDigit === 5 ? "132px" : "116px")
              };
              color:#fff8ef;
              background:linear-gradient(180deg,#fffefb,#ffe7bf 72%,#fffefb);
              -webkit-background-clip:text;
              -webkit-text-fill-color:transparent;
              white-space:nowrap;
              filter:
                drop-shadow(0 4px 0 rgba(255,255,255,.05))
                drop-shadow(0 18px 28px rgba(0,0,0,.32))
                drop-shadow(0 0 20px rgba(255,216,111,.20));
            ">${currentValue}</div>
          </div>

          <div style="position:relative;z-index:2;">
            <div style="font-size:30px;font-weight:900;color:rgba(255,255,255,.90);">Lucky Random • Full Random</div>
            <div style="font-size:22px;color:rgba(255,255,255,.68);margin-top:10px;">${new Date().toLocaleDateString("th-TH")}</div>
          </div>
        </div>
      `;
    }

    async function saveCard(type = "story") {
      if (!currentValue || currentValue === "--") {
        alert("ยังไม่มีเลขที่สุ่ม");
        return;
      }

      buildExportCard(type);
      const exportCard = document.getElementById("exportCard");

      try {
        const canvas = await html2canvas(exportCard, {
          scale: 2,
          useCORS: true,
          backgroundColor: null
        });

        const link = document.createElement("a");
        link.download = type === "story" ? "lucky-drop-story.png" : "lucky-drop-square.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      } catch (error) {
        alert("บันทึกรูปไม่สำเร็จ");
      }
    }

    async function shareNumber() {
      if (!currentValue || currentValue === "--") {
        alert("ยังไม่มีเลขที่สุ่ม");
        return;
      }

      const text = `${APP_NAME}\nเลขนำโชค ${selectedDigit} ตัว: ${currentValue}`;

      if (navigator.share) {
        try {
          await navigator.share({
            title: APP_NAME,
            text
          });
        } catch (error) {}
      } else {
        alert("อุปกรณ์นี้ยังไม่รองรับ Share");
      }
    }

    function shareLine() {
      if (!currentValue || currentValue === "--") {
        alert("ยังไม่มีเลขที่สุ่ม");
        return;
      }

      const text = encodeURIComponent(`${APP_NAME}\nเลขนำโชค ${selectedDigit} ตัว: ${currentValue}`);
      window.open(`https://line.me/R/msg/text/?${text}`, "_blank");
    }

    document.querySelectorAll(".mode-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        if (isSpinning) return;
        selectedDigit = Number(btn.dataset.digit);
        currentValue = "-".repeat(selectedDigit);
        resultNumber.textContent = currentValue;
        resultMeta.textContent = `ตอนนี้เลือก: ${selectedDigit} ตัว`;
        updateModeUI();
      });
    });

    document.getElementById("spinBtn").addEventListener("click", spin);
    document.getElementById("copyBtn").addEventListener("click", copyNumber);
    document.getElementById("saveStoryBtn").addEventListener("click", () => saveCard("story"));
    document.getElementById("saveSquareBtn").addEventListener("click", () => saveCard("square"));
    document.getElementById("shareBtn").addEventListener("click", shareNumber);
    document.getElementById("lineBtn").addEventListener("click", shareLine);

    window.addEventListener("resize", updateResultFont);

    currentValue = "--";
    resultNumber.textContent = currentValue;
    updateModeUI();
  </script>
</body>
</html>
