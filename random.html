<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Drop</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root{
      --bg1:#081120;
      --bg2:#101a33;
      --panel:rgba(255,255,255,.08);
      --panel-line:rgba(255,255,255,.12);
      --text:#f8fbff;
      --muted:#b8c6df;
      --accent1:#7c3aed;
      --accent2:#06b6d4;
      --accent3:#f59e0b;
      --accent4:#ec4899;
      --white:#ffffff;
      --shadow:0 20px 60px rgba(0,0,0,.28);
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(6,182,212,.22), transparent 22%),
        radial-gradient(circle at 90% 12%, rgba(236,72,153,.18), transparent 22%),
        radial-gradient(circle at 50% 100%, rgba(124,58,237,.18), transparent 26%),
        linear-gradient(180deg,var(--bg1),var(--bg2));
      overflow-x:hidden;
    }

    .app{
      max-width:1280px;
      margin:0 auto;
      padding:20px 16px 24px;
      min-height:100vh;
      display:grid;
      grid-template-rows:auto auto 1fr auto;
      gap:18px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:16px;
      flex-wrap:wrap;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .brand-logo{
      width:72px;
      height:72px;
      border-radius:22px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,#f8b84e,#ffd86f);
      color:#111827;
      font-size:32px;
      font-weight:900;
      box-shadow:0 12px 30px rgba(248,184,78,.28);
      flex:0 0 auto;
    }

    .kicker{
      font-size:14px;
      color:#e7f0ff;
      font-weight:900;
      opacity:.9;
      margin-bottom:4px;
    }

    h1{
      margin:0;
      font-size:clamp(44px,7vw,82px);
      line-height:.95;
      letter-spacing:-1.3px;
    }

    .sub{
      margin:10px 0 0;
      max-width:760px;
      color:var(--muted);
      font-size:15px;
      line-height:1.55;
    }

    .top-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .btn{
      border:1px solid rgba(255,255,255,.12);
      cursor:pointer;
      border-radius:18px;
      padding:13px 18px;
      font-weight:900;
      color:white;
      text-decoration:none;
      background:rgba(255,255,255,.08);
      font-size:15px;
      backdrop-filter:blur(12px);
    }

    .mode-row{
      display:grid;
      grid-template-columns:repeat(6,minmax(0,1fr));
      gap:12px;
    }

    .mode-btn{
      min-height:74px;
      border-radius:20px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      color:var(--text);
      font-size:clamp(18px,2vw,24px);
      font-weight:900;
      cursor:pointer;
      transition:.18s ease;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    }

    .mode-btn.active{
      background:linear-gradient(135deg, rgba(245,158,11,.85), rgba(236,72,153,.75));
      border-color:rgba(255,255,255,.22);
      box-shadow:
        0 12px 32px rgba(236,72,153,.22),
        0 0 28px rgba(245,158,11,.18);
      transform:translateY(-1px);
    }

    .stage{
      position:relative;
      min-height:58vh;
      border-radius:40px;
      overflow:hidden;
      border:1px solid var(--panel-line);
      background:
        linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
      backdrop-filter:blur(16px);
      box-shadow:var(--shadow);
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:30px 20px;
    }

    .stage::before{
      content:"";
      position:absolute;
      inset:auto auto 8% 50%;
      transform:translateX(-50%);
      width:min(74vw,720px);
      height:min(24vw,220px);
      border-radius:999px;
      background:radial-gradient(circle, rgba(255,255,255,.10), transparent 72%);
      filter:blur(10px);
      pointer-events:none;
    }

    .stage::after{
      content:"";
      position:absolute;
      width:380px;
      height:380px;
      right:-120px;
      top:-120px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(124,58,237,.24), transparent 70%);
      pointer-events:none;
    }

    .stage-inner{
      position:relative;
      z-index:2;
      width:100%;
      max-width:1100px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height:50vh;
    }

    .number-label{
      font-size:clamp(24px,3vw,34px);
      font-weight:900;
      color:#edf3ff;
      margin-bottom:20px;
    }

    .result-number{
      width:100%;
      text-align:center;
      line-height:1;
      font-weight:900;
      white-space:nowrap;
      font-variant-numeric:tabular-nums;
      color:#ffffff;
      letter-spacing:.03em;
      text-shadow:
        0 6px 18px rgba(0,0,0,.22),
        0 0 16px rgba(255,255,255,.10);
      transition:transform .12s ease, opacity .12s ease, text-shadow .12s ease;
      padding:8px 0;
    }

    .result-number.pop{
      transform:scale(1.08);
      text-shadow:
        0 8px 22px rgba(0,0,0,.28),
        0 0 22px rgba(255,255,255,.18),
        0 0 34px rgba(6,182,212,.14);
    }

    .result-meta{
      margin-top:18px;
      color:var(--muted);
      font-size:16px;
      font-weight:800;
    }

    .action-row{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      justify-content:center;
      align-items:center;
    }

    .spin-btn{
      border:0;
      cursor:pointer;
      border-radius:22px;
      min-height:68px;
      padding:16px 32px;
      font-size:24px;
      font-weight:900;
      color:white;
      background:linear-gradient(135deg,var(--accent3),var(--accent4),var(--accent1));
      box-shadow:
        0 18px 40px rgba(236,72,153,.22),
        0 0 28px rgba(124,58,237,.18);
      min-width:300px;
    }

    .action-btn{
      border:1px solid rgba(255,255,255,.12);
      cursor:pointer;
      border-radius:18px;
      min-height:56px;
      padding:12px 16px;
      font-size:15px;
      font-weight:900;
      color:white;
      background:rgba(255,255,255,.08);
      min-width:132px;
      backdrop-filter:blur(8px);
    }

    .hidden-export{
      position:fixed;
      left:-99999px;
      top:0;
      z-index:-1;
    }

    @media (max-width:1080px){
      .mode-row{grid-template-columns:repeat(3,minmax(0,1fr))}
    }

    @media (max-width:700px){
      .app{padding:14px 10px 18px}
      .mode-row{grid-template-columns:repeat(2,minmax(0,1fr))}
      .spin-btn,.action-btn{width:100%}
      .action-row{justify-content:stretch}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div>
        <div class="brand">
          <div class="brand-logo">🎲</div>
          <div>
            <div class="kicker">Random 100% • ไม่เกี่ยวกับ AI</div>
            <h1>Lucky Drop</h1>
          </div>
        </div>
        <p class="sub">
          เลือกจำนวนหลักแล้วกดสุ่มได้ทันที ใช้กับเลขนำโชค หวยไทย หวยลาว หวยฮานอย
          หรือส่งลิงก์ให้ลูกค้าเล่นแบบหน้าเดียวจบ
        </p>
      </div>

      <div class="top-actions">
        <a class="btn" href="./index.html">← กลับหน้า AI</a>
      </div>
    </div>

    <div class="mode-row">
      <button class="mode-btn" data-digit="1">1 ตัว</button>
      <button class="mode-btn active" data-digit="2">2 ตัว</button>
      <button class="mode-btn" data-digit="3">3 ตัว</button>
      <button class="mode-btn" data-digit="4">4 ตัว</button>
      <button class="mode-btn" data-digit="5">5 ตัว</button>
      <button class="mode-btn" data-digit="6">6 ตัว</button>
    </div>

    <section class="stage">
      <div class="stage-inner">
        <div class="number-label" id="numberLabel">เลขนำโชค 2 ตัว</div>
        <div class="result-number" id="resultNumber">--</div>
        <div class="result-meta" id="resultMeta">กดสุ่มเพื่อเริ่ม</div>
      </div>
    </section>

    <div class="action-row">
      <button class="spin-btn" id="spinBtn">🎲 สุ่มเลย</button>
      <button class="action-btn" id="copyBtn">Copy</button>
      <button class="action-btn" id="saveStoryBtn">Save Story</button>
      <button class="action-btn" id="saveSquareBtn">Save Square</button>
      <button class="action-btn" id="shareBtn">Share</button>
      <button class="action-btn" id="lineBtn">LINE</button>
    </div>
  </div>

  <div id="exportRoot" class="hidden-export"></div>

  <script>
    const APP_NAME = "Lucky Drop";
    let selectedDigit = 2;
    let currentValue = "--";
    let isSpinning = false;

    const resultNumber = document.getElementById("resultNumber");
    const resultMeta = document.getElementById("resultMeta");
    const numberLabel = document.getElementById("numberLabel");
    const spinBtn = document.getElementById("spinBtn");

    function randomInt(maxExclusive) {
      const arr = new Uint32Array(1);
      crypto.getRandomValues(arr);
      return arr[0] % maxExclusive;
    }

    function padNumber(value, size) {
      return String(value).padStart(size, "0");
    }

    function getMaxByDigit(digit) {
      return Math.pow(10, digit);
    }

    function getFontSizePx(digit, width) {
      const rules = {
        1: Math.min(width * 0.34, 290),
        2: Math.min(width * 0.30, 240),
        3: Math.min(width * 0.245, 205),
        4: Math.min(width * 0.205, 172),
        5: Math.min(width * 0.172, 144),
        6: Math.min(width * 0.148, 124)
      };
      return rules[digit] || 100;
    }

    function updateResultFont() {
      const boxWidth = resultNumber.parentElement.clientWidth || 900;
      const size = getFontSizePx(selectedDigit, boxWidth);
      resultNumber.style.fontSize = `${size}px`;
      resultNumber.style.letterSpacing = selectedDigit >= 5 ? ".012em" : ".03em";
    }

    function updateModeUI() {
      document.querySelectorAll(".mode-btn").forEach(btn => {
        btn.classList.toggle("active", Number(btn.dataset.digit) === selectedDigit);
      });
      numberLabel.textContent = `เลขนำโชค ${selectedDigit} ตัว`;
      updateResultFont();
    }

    function rollingValue(max, digit) {
      return padNumber(randomInt(max), digit);
    }

    function setRollingVisual(scale, opacity) {
      resultNumber.style.transform = `scale(${scale})`;
      resultNumber.style.opacity = opacity;
    }

    function finalPop() {
      resultNumber.classList.add("pop");
      setTimeout(() => {
        resultNumber.classList.remove("pop");
        resultNumber.style.transform = "scale(1)";
      }, 240);
    }

    function spin() {
      if (isSpinning) return;

      isSpinning = true;
      spinBtn.disabled = true;
      spinBtn.style.opacity = ".72";

      const max = getMaxByDigit(selectedDigit);
      const finalValue = rollingValue(max, selectedDigit);

      resultMeta.textContent = "กำลังสุ่ม...";
      updateResultFont();

      let phase1 = 0;
      let phase2 = 0;
      let phase3 = 0;

      function runPhase1() {
        resultNumber.textContent = rollingValue(max, selectedDigit);
        setRollingVisual(1.05, ".90");
        phase1++;
        if (phase1 < 24) {
          setTimeout(runPhase1, 24);
        } else {
          runPhase2();
        }
      }

      function runPhase2() {
        resultNumber.textContent = rollingValue(max, selectedDigit);
        setRollingVisual(1.03, ".95");
        phase2++;
        if (phase2 < 10) {
          setTimeout(runPhase2, 52);
        } else {
          runPhase3();
        }
      }

      function runPhase3() {
        resultNumber.textContent = rollingValue(max, selectedDigit);
        setRollingVisual(1.015, ".99");
        phase3++;
        if (phase3 < 5) {
          setTimeout(runPhase3, 105 + (phase3 * 32));
        } else {
          resultNumber.textContent = finalValue;
          resultNumber.style.opacity = "1";
          resultNumber.style.transform = "scale(1)";
          currentValue = finalValue;
          resultMeta.textContent = `ตอนนี้เลือก: ${selectedDigit} ตัว`;
          finalPop();
          isSpinning = false;
          spinBtn.disabled = false;
          spinBtn.style.opacity = "1";
        }
      }

      runPhase1();
    }

    async function copyNumber() {
      if (!currentValue || currentValue === "--") {
        alert("ยังไม่มีเลขที่สุ่ม");
        return;
      }

      try {
        await navigator.clipboard.writeText(currentValue);
        alert("คัดลอกเลขแล้ว");
      } catch (error) {
        alert("คัดลอกไม่สำเร็จ");
      }
    }

    function buildExportCard(type = "story") {
      const exportRoot = document.getElementById("exportRoot");
      const isStory = type === "story";

      const fontSizesStory = { 1: 320, 2: 285, 3: 240, 4: 205, 5: 172, 6: 148 };
      const fontSizesSquare = { 1: 245, 2: 215, 3: 186, 4: 156, 5: 132, 6: 116 };

      const fontSize = isStory ? fontSizesStory[selectedDigit] : fontSizesSquare[selectedDigit];
      const letterSpacing = selectedDigit >= 5 ? ".012em" : ".03em";

      exportRoot.innerHTML = `
        <div id="exportCard" style="
          width:1080px;
          height:${isStory ? "1920px" : "1080px"};
          padding:${isStory ? "64px 56px" : "54px"};
          color:#f8fbff;
          font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
          background:
            radial-gradient(circle at 12% 14%, rgba(45,212,191,.28), transparent 20%),
            radial-gradient(circle at 88% 14%, rgba(236,72,153,.22), transparent 20%),
            radial-gradient(circle at 50% 100%, rgba(124,58,237,.24), transparent 28%),
            linear-gradient(180deg,#0b1220,#131d36);
          position:relative;
          overflow:hidden;
          display:flex;
          flex-direction:column;
          justify-content:space-between;
        ">
          <div style="
            position:absolute;inset:auto auto 10% 50%;
            transform:translateX(-50%);
            width:${isStory ? "760px" : "620px"};
            height:${isStory ? "220px" : "160px"};
            border-radius:999px;
            background:radial-gradient(circle, rgba(255,255,255,.12), transparent 72%);
            filter:blur(12px);
          "></div>

          <div style="
            position:absolute;left:-120px;top:140px;
            width:340px;height:340px;border-radius:50%;
            background:radial-gradient(circle, rgba(6,182,212,.28), transparent 70%);
          "></div>

          <div style="
            position:absolute;right:-120px;top:120px;
            width:340px;height:340px;border-radius:50%;
            background:radial-gradient(circle, rgba(236,72,153,.24), transparent 70%);
          "></div>

          <div style="position:relative;z-index:2;">
            <div style="display:flex;align-items:center;gap:16px;">
              <div style="
                width:88px;height:88px;border-radius:26px;display:grid;place-items:center;
                background:linear-gradient(135deg,#f8b84e,#ffd86f);
                color:#111827;font-size:38px;font-weight:900;
                box-shadow:0 14px 34px rgba(248,184,78,.24);
              ">🎲</div>
              <div>
                <div style="font-size:24px;color:rgba(255,255,255,.84);font-weight:900;">Random 100% • ไม่เกี่ยวกับ AI</div>
                <div style="font-size:74px;font-weight:900;line-height:1;margin-top:4px;">Lucky Drop</div>
              </div>
            </div>
          </div>

          <div style="
            position:relative;z-index:2;
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            text-align:center;flex:1;
            padding:${isStory ? "70px 0 60px" : "30px 0 20px"};
          ">
            <div style="
              font-size:${isStory ? "34px" : "28px"};
              color:rgba(255,255,255,.90);
              font-weight:900;
              margin-bottom:26px;
            ">เลขนำโชค ${selectedDigit} ตัว</div>

            <div style="
              font-size:${fontSize}px;
              line-height:1;
              font-weight:900;
              letter-spacing:${letterSpacing};
              white-space:nowrap;
              color:#ffffff;
              text-shadow:
                0 10px 24px rgba(0,0,0,.24),
                0 0 16px rgba(255,255,255,.12),
                0 0 30px rgba(6,182,212,.10);
            ">${currentValue}</div>
          </div>

          <div style="position:relative;z-index:2;">
            <div style="font-size:30px;font-weight:900;color:rgba(255,255,255,.92);">Lucky Random • Full Random</div>
            <div style="font-size:22px;color:rgba(255,255,255,.70);margin-top:10px;">${new Date().toLocaleDateString("th-TH")}</div>
          </div>
        </div>
      `;
    }

    async function saveCard(type = "story") {
      if (!currentValue || currentValue === "--") {
        alert("ยังไม่มีเลขที่สุ่ม");
        return;
      }

      buildExportCard(type);
      const exportCard = document.getElementById("exportCard");

      try {
        const canvas = await html2canvas(exportCard, {
          scale: 2,
          useCORS: true,
          backgroundColor: null
        });

        const link = document.createElement("a");
        link.download = type === "story" ? "lucky-drop-story.png" : "lucky-drop-square.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      } catch (error) {
        alert("บันทึกรูปไม่สำเร็จ");
      }
    }

    async function shareNumber() {
      if (!currentValue || currentValue === "--") {
        alert("ยังไม่มีเลขที่สุ่ม");
        return;
      }

      const text = `${APP_NAME}\nเลขนำโชค ${selectedDigit} ตัว: ${currentValue}`;

      if (navigator.share) {
        try {
          await navigator.share({
            title: APP_NAME,
            text
          });
        } catch (error) {}
      } else {
        alert("อุปกรณ์นี้ยังไม่รองรับ Share");
      }
    }

    function shareLine() {
      if (!currentValue || currentValue === "--") {
        alert("ยังไม่มีเลขที่สุ่ม");
        return;
      }

      const text = encodeURIComponent(`${APP_NAME}\nเลขนำโชค ${selectedDigit} ตัว: ${currentValue}`);
      window.open(`https://line.me/R/msg/text/?${text}`, "_blank");
    }

    document.querySelectorAll(".mode-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        if (isSpinning) return;
        selectedDigit = Number(btn.dataset.digit);
        currentValue = "-".repeat(selectedDigit);
        resultNumber.textContent = currentValue;
        resultMeta.textContent = `ตอนนี้เลือก: ${selectedDigit} ตัว`;
        updateModeUI();
      });
    });

    document.getElementById("spinBtn").addEventListener("click", spin);
    document.getElementById("copyBtn").addEventListener("click", copyNumber);
    document.getElementById("saveStoryBtn").addEventListener("click", () => saveCard("story"));
    document.getElementById("saveSquareBtn").addEventListener("click", () => saveCard("square"));
    document.getElementById("shareBtn").addEventListener("click", shareNumber);
    document.getElementById("lineBtn").addEventListener("click", shareLine);

    window.addEventListener("resize", updateResultFont);

    currentValue = "--";
    resultNumber.textContent = currentValue;
    updateModeUI();
  </script>
</body>
</html>
