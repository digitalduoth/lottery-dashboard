<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Drop</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root{
      --bg:#050816;
      --bg2:#0a1022;
      --panel:rgba(14,20,38,.82);
      --line:rgba(255,255,255,.10);
      --text:#f8fafc;
      --muted:#aebbd3;
      --gold:#ffd66b;
      --pink:#ff56b3;
      --purple:#8b5cf6;
      --blue:#60a5fa;
      --cyan:#22d3ee;
      --orange:#ff9a3d;
      --shadow:0 30px 90px rgba(0,0,0,.45);
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:
        radial-gradient(circle at 12% 15%, rgba(96,165,250,.18), transparent 22%),
        radial-gradient(circle at 88% 16%, rgba(255,86,179,.16), transparent 24%),
        radial-gradient(circle at 50% 88%, rgba(34,211,238,.12), transparent 22%),
        linear-gradient(180deg,var(--bg),var(--bg2));
      overflow-x:hidden;
    }

    .app{
      max-width:1320px;
      margin:0 auto;
      padding:18px 14px 22px;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      gap:16px;
    }

    .hero,.stage{
      border:1px solid var(--line);
      border-radius:34px;
      background:rgba(15,21,40,.82);
      box-shadow:var(--shadow);
      backdrop-filter:blur(18px);
    }

    .hero{
      padding:22px;
      overflow:hidden;
      position:relative;
      background:linear-gradient(135deg, rgba(96,165,250,.18), rgba(255,86,179,.14));
    }

    .hero::after{
      content:"";
      position:absolute;
      width:240px;
      height:240px;
      border-radius:50%;
      right:-60px;
      top:-60px;
      background:radial-gradient(circle, rgba(255,214,107,.22), transparent 70%);
      pointer-events:none;
    }

    .hero-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .brand-logo{
      width:64px;
      height:64px;
      border-radius:20px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,var(--gold),#ffb84e);
      color:#111827;
      font-size:30px;
      font-weight:900;
      box-shadow:0 12px 28px rgba(255,214,107,.24);
      flex:0 0 auto;
    }

    .kicker{
      font-size:13px;
      color:#eef4ff;
      opacity:.9;
      margin-bottom:6px;
      font-weight:800;
    }

    h1{
      margin:0;
      font-size:clamp(36px,6vw,76px);
      line-height:.95;
      letter-spacing:-1.2px;
    }

    .sub{
      margin:12px 0 0;
      max-width:820px;
      color:var(--muted);
      font-size:15px;
      line-height:1.6;
    }

    .hero-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .btn{
      border:0;
      cursor:pointer;
      border-radius:16px;
      padding:13px 18px;
      font-weight:900;
      color:white;
      text-decoration:none;
      background:linear-gradient(135deg,#4f8cff,#7c3aed);
      box-shadow:0 10px 24px rgba(79,140,255,.22);
      font-size:15px;
    }

    .btn.ghost{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      box-shadow:none;
    }

    .stage{
      padding:18px;
      min-height:72vh;
      display:grid;
      grid-template-rows:auto 1fr auto;
      gap:18px;
      position:relative;
      overflow:hidden;
      background:
        radial-gradient(circle at 15% 15%, rgba(255,255,255,.04), transparent 18%),
        radial-gradient(circle at 85% 22%, rgba(255,86,179,.08), transparent 22%),
        linear-gradient(135deg, rgba(10,15,30,.96), rgba(20,28,55,.94));
    }

    .stage::before{
      content:"";
      position:absolute;
      width:360px;
      height:360px;
      border-radius:50%;
      right:-110px;
      bottom:-110px;
      background:radial-gradient(circle, rgba(96,165,250,.14), transparent 70%);
      pointer-events:none;
    }

    .stage::after{
      content:"";
      position:absolute;
      width:260px;
      height:260px;
      border-radius:50%;
      left:-80px;
      top:40%;
      background:radial-gradient(circle, rgba(255,86,179,.12), transparent 70%);
      pointer-events:none;
    }

    .stage-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
      position:relative;
      z-index:1;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 15px;
      border-radius:999px;
      font-size:13px;
      font-weight:900;
      color:#edf4ff;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.08);
    }

    .digit-picks{
      display:grid;
      grid-template-columns:repeat(6,minmax(0,1fr));
      gap:12px;
      position:relative;
      z-index:1;
    }

    .digit-btn{
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.05);
      color:var(--text);
      border-radius:20px;
      padding:15px 10px;
      font-size:clamp(18px,2vw,26px);
      font-weight:900;
      cursor:pointer;
      min-height:76px;
      transition:.18s ease;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
    }

    .digit-btn.active{
      background:linear-gradient(135deg, rgba(255,154,61,.30), rgba(255,86,179,.26));
      border-color:rgba(255,214,107,.40);
      box-shadow:
        0 0 0 2px rgba(255,214,107,.10) inset,
        0 18px 40px rgba(255,86,179,.18),
        0 0 32px rgba(255,154,61,.12);
      transform:translateY(-1px);
    }

    .result-wrap{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:300px;
    }

    .result-card{
      width:100%;
      min-height:420px;
      border-radius:36px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      padding:28px 24px;
      background:linear-gradient(180deg, rgba(255,255,255,.065), rgba(255,255,255,.035));
      border:1px solid rgba(255,255,255,.11);
      overflow:hidden;
      position:relative;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 20px 50px rgba(0,0,0,.18);
    }

    .result-card::before{
      content:"";
      position:absolute;
      width:280px;
      height:280px;
      border-radius:50%;
      left:-70px;
      bottom:-70px;
      background:radial-gradient(circle, rgba(255,255,255,.06), transparent 70%);
      pointer-events:none;
    }

    .result-card::after{
      content:"";
      position:absolute;
      width:300px;
      height:300px;
      border-radius:50%;
      right:-90px;
      top:-90px;
      background:radial-gradient(circle, rgba(255,214,107,.08), transparent 70%);
      pointer-events:none;
    }

    .result-label{
      color:#edf4ff;
      font-size:clamp(18px,2vw,24px);
      font-weight:900;
      opacity:.95;
      margin-bottom:18px;
      text-align:center;
      letter-spacing:.01em;
    }

    .result-number{
      width:100%;
      text-align:center;
      line-height:1;
      font-weight:900;
      white-space:nowrap;
      font-variant-numeric:tabular-nums;
      letter-spacing:.03em;
      text-shadow:
        0 0 10px rgba(255,255,255,.12),
        0 0 24px rgba(255,214,107,.08),
        0 14px 40px rgba(0,0,0,.34);
      transition:transform .15s ease, opacity .15s ease, filter .15s ease;
      overflow:hidden;
      position:relative;
      z-index:1;
      color:#fff8ef;
    }

    .result-number.glow{
      filter:brightness(1.08);
      text-shadow:
        0 0 16px rgba(255,255,255,.20),
        0 0 34px rgba(255,214,107,.14),
        0 18px 46px rgba(0,0,0,.34);
    }

    .result-meta{
      margin-top:16px;
      color:var(--muted);
      font-size:15px;
      font-weight:800;
      text-align:center;
      position:relative;
      z-index:1;
    }

    .action-row{
      position:relative;
      z-index:1;
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      justify-content:center;
      align-items:center;
    }

    .spin-btn{
      border:0;
      cursor:pointer;
      border-radius:24px;
      min-height:66px;
      padding:16px 28px;
      font-size:24px;
      font-weight:900;
      color:white;
      background:linear-gradient(135deg,var(--orange),var(--pink),var(--purple));
      box-shadow:
        0 18px 40px rgba(255,86,179,.20),
        0 0 30px rgba(255,154,61,.12);
      min-width:280px;
    }

    .action-btn{
      border:1px solid rgba(255,255,255,.10);
      cursor:pointer;
      border-radius:18px;
      min-height:54px;
      padding:12px 16px;
      font-size:15px;
      font-weight:900;
      color:white;
      background:rgba(255,255,255,.06);
      min-width:132px;
      backdrop-filter:blur(6px);
    }

    .hidden-export{
      position:fixed;
      left:-99999px;
      top:0;
      z-index:-1;
    }

    @media (max-width:1080px){
      .digit-picks{grid-template-columns:repeat(3,minmax(0,1fr))}
      .result-card{min-height:360px}
    }

    @media (max-width:700px){
      .app{padding:12px 10px 18px}
      .digit-picks{grid-template-columns:repeat(2,minmax(0,1fr))}
      .spin-btn,.action-btn{width:100%}
      .action-row{justify-content:stretch}
      .result-card{min-height:290px;padding:22px 16px}
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="hero">
      <div class="hero-top">
        <div>
          <div class="brand">
            <div class="brand-logo">🎲</div>
            <div>
              <div class="kicker">Random 100% • ไม่เกี่ยวกับ AI</div>
              <h1>Lucky Drop</h1>
            </div>
          </div>
          <p class="sub">
            เลือกจำนวนหลักแล้วกดสุ่มได้ทันที ใช้กับเลขนำโชค หวยไทย หวยลาว หวยฮานอย
            หรือส่งลิงก์ให้ลูกค้าเล่นแบบหน้าเดียวจบ
          </p>
        </div>

        <div class="hero-actions">
          <a class="btn ghost" href="./index.html">← กลับหน้า AI</a>
        </div>
      </div>
    </section>

    <section class="stage">
      <div class="stage-head">
        <div class="pill">Lucky Random • Full Random</div>
        <div class="pill" id="currentModePill">ตอนนี้เลือก: 2 ตัว</div>
      </div>

      <div class="digit-picks">
        <button class="digit-btn" data-digit="1">1 ตัว</button>
        <button class="digit-btn active" data-digit="2">2 ตัว</button>
        <button class="digit-btn" data-digit="3">3 ตัว</button>
        <button class="digit-btn" data-digit="4">4 ตัว</button>
        <button class="digit-btn" data-digit="5">5 ตัว</button>
        <button class="digit-btn" data-digit="6">6 ตัว</button>
      </div>

      <div class="result-wrap" id="captureArea">
        <div class="result-card">
          <div class="result-label">เลขนำโชคของคุณ</div>
          <div class="result-number" id="resultNumber">--</div>
          <div class="result-meta" id="resultMeta">กดสุ่มเพื่อเริ่ม</div>
        </div>
      </div>

      <div class="action-row">
        <button class="spin-btn" id="spinBtn">🎲 สุ่มเลย</button>
        <button class="action-btn" id="copyBtn">Copy</button>
        <button class="action-btn" id="saveStoryBtn">Save Story</button>
        <button class="action-btn" id="saveSquareBtn">Save Square</button>
        <button class="action-btn" id="shareBtn">Share</button>
        <button class="action-btn" id="lineBtn">LINE</button>
      </div>
    </section>
  </div>

  <div id="exportRoot" class="hidden-export"></div>

  <script>
    const APP_NAME = "Lucky Drop";
    let selectedDigit = 2;
    let currentValue = "--";
    let isSpinning = false;

    const resultNumber = document.getElementById("resultNumber");
    const resultMeta = document.getElementById("resultMeta");
    const currentModePill = document.getElementById("currentModePill");
    const spinBtn = document.getElementById("spinBtn");

    function randomInt(maxExclusive) {
      const arr = new Uint32Array(1);
      crypto.getRandomValues(arr);
      return arr[0] % maxExclusive;
    }

    function padNumber(value, size) {
      return String(value).padStart(size, "0");
    }

    function getMaxByDigit(digit) {
      return Math.pow(10, digit);
    }

    function getFontSizePx(digit, width) {
      const rules = {
        1: Math.min(width * 0.42, 270),
        2: Math.min(width * 0.35, 240),
        3: Math.min(width * 0.28, 198),
        4: Math.min(width * 0.225, 162),
        5: Math.min(width * 0.185, 132),
        6: Math.min(width * 0.155, 112)
      };
      return rules[digit] || 100;
    }

    function updateResultFont() {
      const boxWidth = resultNumber.parentElement.clientWidth || 700;
      const size = getFontSizePx(selectedDigit, boxWidth);
      resultNumber.style.fontSize = `${size}px`;
      resultNumber.style.letterSpacing = selectedDigit >= 5 ? ".01em" : ".03em";
    }

    function updateModeUI() {
      document.querySelectorAll(".digit-btn").forEach(btn => {
        btn.classList.toggle("active", Number(btn.dataset.digit) === selectedDigit);
      });
      currentModePill.textContent = `ตอนนี้เลือก: ${selectedDigit} ตัว`;
      updateResultFont();
    }

    function animatePulseEnd() {
      resultNumber.classList.add("glow");
      resultNumber.style.transform = "scale(1.05)";
      setTimeout(() => {
        resultNumber.style.transform = "scale(1)";
      }, 180);
      setTimeout(() => {
        resultNumber.classList.remove("glow");
      }, 560);
    }

    async function spin() {
      if (isSpinning) return;

      isSpinning = true;
      spinBtn.disabled = true;
      spinBtn.style.opacity = ".75";

      const max = getMaxByDigit(selectedDigit);
      const finalValue = padNumber(randomInt(max), selectedDigit);

      resultMeta.textContent = "กำลังสุ่ม...";
      updateResultFont();

      const fastCount = selectedDigit >= 5 ? 18 : 20;
      const slowCount = 7;

      let i = 0;

      function tickFast() {
        if (i < fastCount) {
          resultNumber.textContent = padNumber(randomInt(max), selectedDigit);
          resultNumber.style.transform = i % 2 === 0 ? "scale(1.03)" : "scale(0.995)";
          resultNumber.style.opacity = ".96";
          i++;
          setTimeout(tickFast, 48);
        } else {
          tickSlow(0);
        }
      }

      function tickSlow(step) {
        if (step < slowCount) {
          resultNumber.textContent = padNumber(randomInt(max), selectedDigit);
          resultNumber.style.transform = "scale(1.015)";
          resultNumber.style.opacity = ".985";
          setTimeout(() => tickSlow(step + 1), 95 + (step * 28));
        } else {
          resultNumber.textContent = finalValue;
          resultNumber.style.opacity = "1";
          resultNumber.style.transform = "scale(1)";
          currentValue = finalValue;
          resultMeta.textContent = `ตอนนี้เลือก: ${selectedDigit} ตัว`;
          animatePulseEnd();
          isSpinning = false;
          spinBtn.disabled = false;
          spinBtn.style.opacity = "1";
        }
      }

      tickFast();
    }

    async function copyNumber() {
      if (!currentValue || currentValue === "--") {
        alert("ยังไม่มีเลขที่สุ่ม");
        return;
      }

      try {
        await navigator.clipboard.writeText(currentValue);
        alert("คัดลอกเลขแล้ว");
      } catch (error) {
        alert("คัดลอกไม่สำเร็จ");
      }
    }

    function buildExportCard(type = "story") {
      const exportRoot = document.getElementById("exportRoot");
      const isStory = type === "story";

      exportRoot.innerHTML = `
        <div id="exportCard" style="
          width:1080px;
          height:${isStory ? "1920px" : "1080px"};
          padding:56px;
          border-radius:42px;
          color:#ffffff;
          font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
          background:
            radial-gradient(circle at 12% 15%, rgba(96,165,250,.18), transparent 22%),
            radial-gradient(circle at 88% 16%, rgba(255,86,179,.16), transparent 24%),
            radial-gradient(circle at 50% 88%, rgba(34,211,238,.12), transparent 22%),
            linear-gradient(180deg,#050816,#0a1022);
          display:flex;
          flex-direction:column;
          justify-content:space-between;
          border:1px solid rgba(255,255,255,.08);
          overflow:hidden;
          position:relative;
        ">
          <div style="
            position:absolute;right:-100px;top:-100px;width:320px;height:320px;border-radius:50%;
            background:radial-gradient(circle, rgba(255,214,107,.18), transparent 70%);
          "></div>

          <div style="position:relative;z-index:1;">
            <div style="display:flex;align-items:center;gap:16px;">
              <div style="
                width:88px;height:88px;border-radius:26px;display:grid;place-items:center;
                background:linear-gradient(135deg,#ffd66b,#ffb84e);color:#111827;font-size:38px;font-weight:900;
              ">🎲</div>
              <div>
                <div style="font-size:24px;color:rgba(255,255,255,.75);font-weight:800;">Random 100% • ไม่เกี่ยวกับ AI</div>
                <div style="font-size:72px;font-weight:900;line-height:1;margin-top:6px;">${APP_NAME}</div>
              </div>
            </div>
          </div>

          <div style="
            position:relative;z-index:1;
            display:flex;align-items:center;justify-content:center;flex-direction:column;
            border-radius:38px;
            padding:40px 28px;
            background:linear-gradient(180deg, rgba(255,255,255,.065), rgba(255,255,255,.035));
            border:1px solid rgba(255,255,255,.11);
            min-height:${isStory ? "860px" : "520px"};
          ">
            <div style="font-size:28px;color:rgba(255,255,255,.82);font-weight:900;margin-bottom:24px;">เลขนำโชค ${selectedDigit} ตัว</div>
            <div style="
              font-weight:900;
              line-height:1;
              letter-spacing:${selectedDigit >= 5 ? ".01em" : ".03em"};
              font-size:${isStory
                ? (selectedDigit <= 2 ? "250px" : selectedDigit === 3 ? "210px" : selectedDigit === 4 ? "180px" : selectedDigit === 5 ? "145px" : "126px")
                : (selectedDigit <= 2 ? "210px" : selectedDigit === 3 ? "185px" : selectedDigit === 4 ? "155px" : selectedDigit === 5 ? "128px" : "112px")
              };
              text-align:center;
              white-space:nowrap;
              color:#fff8ef;
              text-shadow:0 0 16px rgba(255,255,255,.16), 0 0 30px rgba(255,214,107,.10), 0 16px 38px rgba(0,0,0,.30);
            ">${currentValue}</div>
          </div>

          <div style="position:relative;z-index:1;">
            <div style="font-size:28px;font-weight:900;color:rgba(255,255,255,.84);">Lucky Random • Full Random</div>
            <div style="font-size:22px;color:rgba(255,255,255,.66);margin-top:10px;">${new Date().toLocaleDateString("th-TH")}</div>
          </div>
        </div>
      `;
    }

    async function saveCard(type = "story") {
      if (!currentValue || currentValue === "--") {
        alert("ยังไม่มีเลขที่สุ่ม");
        return;
      }

      buildExportCard(type);
      const exportCard = document.getElementById("exportCard");

      try {
        const canvas = await html2canvas(exportCard, {
          scale: 2,
          useCORS: true,
          backgroundColor: null
        });

        const link = document.createElement("a");
        link.download = type === "story" ? "lucky-drop-story.png" : "lucky-drop-square.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      } catch (error) {
        alert("บันทึกรูปไม่สำเร็จ");
      }
    }

    async function shareNumber() {
      if (!currentValue || currentValue === "--") {
        alert("ยังไม่มีเลขที่สุ่ม");
        return;
      }

      const text = `${APP_NAME}\nเลขนำโชค ${selectedDigit} ตัว: ${currentValue}`;

      if (navigator.share) {
        try {
          await navigator.share({
            title: APP_NAME,
            text
          });
        } catch (error) {}
      } else {
        alert("อุปกรณ์นี้ยังไม่รองรับ Share");
      }
    }

    function shareLine() {
      if (!currentValue || currentValue === "--") {
        alert("ยังไม่มีเลขที่สุ่ม");
        return;
      }

      const text = encodeURIComponent(`${APP_NAME}\nเลขนำโชค ${selectedDigit} ตัว: ${currentValue}`);
      window.open(`https://line.me/R/msg/text/?${text}`, "_blank");
    }

    document.querySelectorAll(".digit-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        if (isSpinning) return;
        selectedDigit = Number(btn.dataset.digit);
        currentValue = "-".repeat(selectedDigit);
        resultNumber.textContent = currentValue;
        resultMeta.textContent = `ตอนนี้เลือก: ${selectedDigit} ตัว`;
        updateModeUI();
      });
    });

    document.getElementById("spinBtn").addEventListener("click", spin);
    document.getElementById("copyBtn").addEventListener("click", copyNumber);
    document.getElementById("saveStoryBtn").addEventListener("click", () => saveCard("story"));
    document.getElementById("saveSquareBtn").addEventListener("click", () => saveCard("square"));
    document.getElementById("shareBtn").addEventListener("click", shareNumber);
    document.getElementById("lineBtn").addEventListener("click", shareLine);

    window.addEventListener("resize", updateResultFont);

    currentValue = "--";
    resultNumber.textContent = currentValue;
    updateModeUI();
  </script>
</body>
</html>
