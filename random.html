<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Drop</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  background: radial-gradient(circle at top left, #1e293b, #020617);
  color: #fff;
  padding: 20px;
}

h1 {
  font-size: 48px;
  font-weight: 800;
}

.sub {
  opacity: 0.7;
  margin-bottom: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin: 20px 0;
}

.btn {
  padding: 16px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05);
  color: #fff;
  font-weight: 600;
  cursor: pointer;
}

.btn.active {
  background: linear-gradient(135deg,#6366f1,#ec4899);
}

.result-box {
  margin: 40px 0;
  text-align: center;
}

#result {
  font-size: 80px;
  font-weight: 800;
  letter-spacing: 6px;
}

.label {
  opacity: 0.6;
}

.run {
  width: 100%;
  padding: 18px;
  border-radius: 16px;
  border: none;
  background: linear-gradient(135deg,#6366f1,#ec4899);
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 20px;
}

.actions {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 10px;
}

</style>
</head>

<body>

<h1>Lucky Drop</h1>
<div class="sub">Pure Random • Real Luck</div>

<div class="grid">
<button class="btn" data-len="1">1 ตัว</button>
<button class="btn active" data-len="2">2 ตัว</button>
<button class="btn" data-len="3">3 ตัว</button>
<button class="btn" data-len="4">4 ตัว</button>
<button class="btn" data-len="5">5 ตัว</button>
<button class="btn" data-len="6">6 ตัว</button>
</div>

<div class="result-box">
<div id="result">--</div>
<div class="label">เลขล่าสุด</div>
</div>

<button class="run" id="runBtn">🎲 สุ่มเลข</button>

<div class="actions">
<button class="btn" id="saveStory">Save Story</button>
<button class="btn" id="saveSquare">Save Square</button>
</div>
<script>
  const segmentButtons = [...document.querySelectorAll(".btn[data-len]")];
  const resultEl = document.getElementById("result");
  const runBtn = document.getElementById("runBtn");
  const saveStoryBtn = document.getElementById("saveStory");
  const saveSquareBtn = document.getElementById("saveSquare");

  const state = {
    len: 2,
    value: "",
    spinning: false
  };

  function setActiveLength(len) {
    state.len = len;
    segmentButtons.forEach((btn) => {
      btn.classList.toggle("active", Number(btn.dataset.len) === len);
    });

    if (!state.value) {
      resultEl.textContent = "-".repeat(len);
    }
  }

  function randomDigits(len) {
    let out = "";
    for (let i = 0; i < len; i += 1) {
      out += Math.floor(Math.random() * 10).toString();
    }
    return out;
  }

  async function spinNumber() {
    if (state.spinning) return;

    state.spinning = true;
    runBtn.disabled = true;

    const finalValue = randomDigits(state.len);

    // เร็ว + ตื่นเต้น + ยาวขึ้นนิด
    const rounds = 22;
    const startDelay = 38;
    const stepDelay = 8;

    for (let i = 0; i < rounds; i += 1) {
      resultEl.style.transform = "translateY(8px) scale(0.985)";
      resultEl.style.opacity = "0.65";
      resultEl.textContent = randomDigits(state.len);

      const delay = startDelay + (i * stepDelay);
      await new Promise((resolve) => setTimeout(resolve, delay));
    }

    resultEl.style.transform = "translateY(0) scale(1)";
    resultEl.style.opacity = "1";
    resultEl.textContent = finalValue;
    state.value = finalValue;

    runBtn.disabled = false;
    state.spinning = false;
  }

  function formatThaiDate() {
    const now = new Date();
    const thaiYear = now.getFullYear() + 543;
    const day = now.getDate();
    const month = now.getMonth() + 1;
    return `${day}/${month}/${thaiYear}`;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function getThemeConfig() {
    return {
      bgTop: "#02050d",
      bgBottom: "#071126",
      glowA: "rgba(120,216,255,0.10)",
      glowB: "rgba(217,87,170,0.10)",
      title: "#ffffff",
      sub: "rgba(255,255,255,0.82)",
      digits: "#ffffff",
      footer: "rgba(255,255,255,0.84)",
      date: "rgba(255,255,255,0.64)"
    };
  }

  function drawPosterBackground(ctx, width, height, theme) {
    const bg = ctx.createLinearGradient(0, 0, 0, height);
    bg.addColorStop(0, theme.bgTop);
    bg.addColorStop(1, theme.bgBottom);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, width, height);

    ctx.globalAlpha = 1;

    const glow1 = ctx.createRadialGradient(
      width * 0.08, height * 0.12, 0,
      width * 0.08, height * 0.12, width * 0.20
    );
    glow1.addColorStop(0, theme.glowA);
    glow1.addColorStop(1, "transparent");
    ctx.fillStyle = glow1;
    ctx.fillRect(0, 0, width, height);

    const glow2 = ctx.createRadialGradient(
      width * 0.90, height * 0.16, 0,
      width * 0.90, height * 0.16, width * 0.15
    );
    glow2.addColorStop(0, theme.glowB);
    glow2.addColorStop(1, "transparent");
    ctx.fillStyle = glow2;
    ctx.fillRect(0, 0, width, height);

    const floorGlow = ctx.createLinearGradient(0, height * 0.72, 0, height);
    floorGlow.addColorStop(0, "rgba(255,255,255,0)");
    floorGlow.addColorStop(1, "rgba(80,120,255,0.04)");
    ctx.fillStyle = floorGlow;
    ctx.fillRect(0, 0, width, height);
  }

  function drawPosterLayout(type = "story") {
    if (!state.value) {
      alert("ยังไม่มีเลขให้บันทึก");
      return;
    }

    const isStory = type === "story";
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = 1080;
    canvas.height = isStory ? 1920 : 1080;

    const width = canvas.width;
    const height = canvas.height;
    const theme = getThemeConfig();

    drawPosterBackground(ctx, width, height, theme);

    // Brand
    ctx.textAlign = "left";
    ctx.fillStyle = theme.title;
    ctx.font = "800 26px Inter, Arial, sans-serif";
    ctx.fillText("Random 100% • ไม่เกี่ยวกับ AI", 70, 86);

    ctx.font = "800 82px Inter, Arial, sans-serif";
    ctx.fillText("Lucky Drop", 70, 162);

    ctx.fillStyle = theme.sub;
    ctx.font = "700 36px Inter, Arial, sans-serif";
    ctx.fillText("Pure Random • Real Luck", 70, 214);

    // Main area — ไม่มีกรอบเลข, ไม่มีกรอบซ้อน
    const labelY = isStory ? 420 : 360;
    const numberY = isStory ? 860 : 590;
    const hintY = isStory ? 1040 : 710;

    // label
    ctx.textAlign = "center";
    ctx.fillStyle = theme.title;
    ctx.font = `800 ${isStory ? 64 : 54}px Inter, Arial, sans-serif`;
    ctx.fillText(`เลขนำโชค ${state.len} ตัว`, width / 2, labelY);

    // soft spotlight behind number (ไม่ใช่กรอบ)
    const spot = ctx.createRadialGradient(
      width / 2,
      numberY - 40,
      10,
      width / 2,
      numberY - 40,
      isStory ? 280 : 220
    );
    spot.addColorStop(0, "rgba(255,255,255,0.035)");
    spot.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = spot;
    ctx.beginPath();
    ctx.arc(width / 2, numberY - 40, isStory ? 280 : 220, 0, Math.PI * 2);
    ctx.fill();

    // number
    ctx.fillStyle = theme.digits;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const chars = state.value.split("");
    let fontSize = isStory ? 220 : 190;
    if (state.len >= 5) fontSize = isStory ? 190 : 150;
    if (state.len === 6) fontSize = isStory ? 175 : 138;
    if (state.len === 1) fontSize = isStory ? 260 : 210;

    ctx.font = `800 ${fontSize}px Inter, Arial, sans-serif`;

    let gap = isStory ? 128 : 100;
    if (state.len >= 5) gap = isStory ? 112 : 86;
    if (state.len === 6) gap = isStory ? 100 : 76;
    if (state.len <= 2) gap = isStory ? 160 : 126;

    const startX = width / 2 - ((chars.length - 1) * gap) / 2;

    chars.forEach((char, index) => {
      const x = startX + (index * gap);

      ctx.shadowColor = "rgba(0,0,0,0.30)";
      ctx.shadowBlur = 18;
      ctx.fillText(char, x, numberY);
    });

    ctx.shadowBlur = 0;

    // hint
    ctx.fillStyle = theme.sub;
    ctx.font = `700 ${isStory ? 38 : 32}px Inter, Arial, sans-serif`;
    ctx.fillText("เลขล่าสุด", width / 2, hintY);

    // footer
    ctx.textAlign = "left";
    ctx.fillStyle = theme.footer;
    ctx.font = "800 34px Inter, Arial, sans-serif";
    ctx.fillText("Lucky Random • Full Random", 70, height - 96);

    ctx.fillStyle = theme.date;
    ctx.font = "700 24px Inter, Arial, sans-serif";
    ctx.fillText(formatThaiDate(), 70, height - 50);

    return canvas;
  }

  function exportImage(type = "story") {
    const canvas = drawPosterLayout(type);
    if (!canvas) return;

    const link = document.createElement("a");
    link.download = `lucky-drop-${type}-${state.value}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
  }

  segmentButtons.forEach((btn) => {
    btn.addEventListener("click", () => {
      if (state.spinning) return;
      setActiveLength(Number(btn.dataset.len));
    });
  });

  runBtn.addEventListener("click", spinNumber);
  saveStoryBtn.addEventListener("click", () => exportImage("story"));
  saveSquareBtn.addEventListener("click", () => exportImage("square"));

  // init
  setActiveLength(2);
  resultEl.style.transition = "transform 0.12s ease, opacity 0.12s ease";
</script>
</body>
</html>
