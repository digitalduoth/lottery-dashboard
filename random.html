<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lucky Drop</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}

body{
  background: linear-gradient(180deg,#06080f,#0a1224);
  color:#fff;
  padding:20px;
}

/* HEADER */
h1{
  font-size:42px;
  font-weight:900;
}
.sub{
  opacity:.7;
  margin-bottom:20px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-bottom:20px;
}

.btn{
  padding:18px;
  border-radius:16px;
  background:rgba(255,255,255,0.05);
  text-align:center;
  font-weight:700;
  border:1px solid rgba(255,255,255,0.08);
  cursor:pointer;
}

.btn.active{
  background:rgba(255,255,255,0.12);
}

/* RESULT CARD */
.card{
  margin-top:10px;
  padding:30px 16px;
  border-radius:20px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.08);
  text-align:center;
}

.label{
  font-size:18px;
  opacity:.7;
}

.result{
  width:100%;
  font-weight:900;
  font-size:140px;
  letter-spacing:-0.07em;
  white-space:nowrap;
  margin:20px 0;
}

.hint{
  opacity:.5;
}

/* MAIN BUTTON */
.run{
  margin-top:16px;
  padding:18px;
  border-radius:18px;
  text-align:center;
  font-weight:700;
  background:linear-gradient(90deg,#1c2a4a,#2d3f75);
  cursor:pointer;
}

/* ACTIONS */
.actions{
  margin-top:14px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.actions div{
  padding:14px;
  border-radius:14px;
  text-align:center;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  cursor:pointer;
}

footer{
  margin-top:30px;
  opacity:.6;
  font-size:14px;
}
</style>
</head>

<body>

<h1>Lucky Drop</h1>
<div class="sub">Pure Random • Real Luck</div>

<div class="grid">
  <div class="btn active" data-len="1">1 ตัว</div>
  <div class="btn" data-len="2">2 ตัว</div>
  <div class="btn" data-len="3">3 ตัว</div>
  <div class="btn" data-len="4">4 ตัว</div>
  <div class="btn" data-len="5">5 ตัว</div>
  <div class="btn" data-len="6">6 ตัว</div>
</div>

<div class="card">
  <div class="label" id="label">เลขนำโชค 1 ตัว</div>
  <div class="result" id="result">-</div>
  <div class="hint">เลขล่าสุด</div>
</div>

<div class="run" id="run">🎲 สุ่มเลข</div>

<div class="actions">
  <div id="copy">Copy</div>
  <div id="share">Share</div>
  <div id="story">Save Story</div>
  <div id="square">Save Square</div>
</div>

<footer>
Lucky Random • Full Random
</footer>

<script>
const resultEl = document.getElementById("result");
const labelEl = document.getElementById("label");
let len = 1;
let value = "";

/* RANDOM */
function random(n){
  let s="";
  for(let i=0;i<n;i++) s+=Math.floor(Math.random()*10);
  return s;
}

/* AUTO SCALE (สำคัญ) */
function fit(){
  if(!value)return;

  let base = 140;
  if(len===2) base=130;
  if(len===3) base=115;
  if(len===4) base=100;
  if(len===5) base=85;
  if(len===6) base=70;

  resultEl.style.fontSize = base+"px";

  const max = resultEl.parentElement.clientWidth - 30;
  const w = resultEl.scrollWidth;

  if(w>max){
    const ratio = max/w;
    resultEl.style.fontSize = (base*ratio)+"px";
  }
}

/* BUTTON SELECT */
document.querySelectorAll(".btn").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".btn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    len = Number(b.dataset.len);
    labelEl.innerText = `เลขนำโชค ${len} ตัว`;
    resultEl.innerText="-";
    value="";
  }
});

/* RUN */
document.getElementById("run").onclick=()=>{
  value = random(len);
  resultEl.innerText = value;
  fit();
};

/* COPY */
document.getElementById("copy").onclick=()=>{
  if(!value)return alert("ยังไม่มีเลข");
  navigator.clipboard.writeText(value);
};

/* SHARE */
document.getElementById("share").onclick=()=>{
  if(!value)return;
  const text=`Lucky Drop: ${value}`;
  if(navigator.share){
    navigator.share({text});
  }else{
    navigator.clipboard.writeText(text);
    alert("คัดลอกแล้ว");
  }
};

/* SAVE IMAGE */
function save(type){
  if(!value)return;

  const c=document.createElement("canvas");
  const ctx=c.getContext("2d");

  c.width=1080;
  c.height= type==="story"?1920:1080;

  const g=ctx.createLinearGradient(0,0,0,c.height);
  g.addColorStop(0,"#06080f");
  g.addColorStop(1,"#0a1224");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,c.width,c.height);

  ctx.fillStyle="#fff";
  ctx.textAlign="center";

  ctx.font="bold 60px Inter";
  ctx.fillText(`เลขนำโชค ${len} ตัว`,540, type==="story"?500:350);

  let size=200-(len*15);
  ctx.font=`900 ${size}px Inter`;
  ctx.fillText(value,540,type==="story"?900:550);

  const a=document.createElement("a");
  a.href=c.toDataURL();
  a.download="lucky.png";
  a.click();
}

document.getElementById("story").onclick=()=>save("story");
document.getElementById("square").onclick=()=>save("square");

window.onresize=fit;
</script>

</body>
</html>
