<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />
  <title>Lucky Drop</title>

  <meta name="theme-color" content="#050816" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />

  <style>
    :root {
      --bg: #040816;
      --bg-2: #071124;
      --panel: rgba(10, 18, 36, 0.86);
      --panel-soft: rgba(255, 255, 255, 0.03);
      --line: rgba(255, 255, 255, 0.08);
      --text: #f8fbff;
      --muted: #a8b3c9;

      --cyan: #6ad8ff;
      --blue: #78a8ff;
      --purple: #8f68ff;
      --pink: #e45ab5;
      --green: #2dd36f;

      --shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 18px;
      --radius-sm: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 10%, rgba(106, 216, 255, 0.18), transparent 22%),
        radial-gradient(circle at 88% 14%, rgba(228, 90, 181, 0.18), transparent 22%),
        radial-gradient(circle at 50% 100%, rgba(120, 168, 255, 0.1), transparent 28%),
        linear-gradient(180deg, #02050f 0%, var(--bg) 35%, var(--bg-2) 100%);
      overflow-x: hidden;
    }

    body {
      user-select: none;
    }

    .app {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: max(20px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom)) 18px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .brand-icon {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)),
        rgba(11, 18, 36, 0.92);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 16px 34px rgba(0,0,0,0.34),
        0 0 40px rgba(126, 104, 255, 0.16);
      flex-shrink: 0;
    }

    .brand-text {
      min-width: 0;
    }

    .eyebrow {
      color: rgba(255,255,255,0.72);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.01em;
      margin-bottom: 2px;
    }

    .title {
      font-size: clamp(42px, 8vw, 88px);
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: -0.04em;
      margin: 0;
    }

    .subtitle {
      color: #d7dff0;
      font-size: clamp(16px, 2vw, 22px);
      font-weight: 700;
      margin-top: 10px;
      letter-spacing: 0.04em;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 14px;
      margin: 22px 0 20px;
    }

    .segment-btn {
      height: 92px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.1);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)),
        rgba(10, 18, 36, 0.86);
      color: #fff;
      font-size: clamp(18px, 2vw, 26px);
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease, opacity 0.16s ease;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .segment-btn:active,
    .primary-btn:active,
    .action-btn:active {
      transform: scale(0.98);
    }

    .segment-btn.active {
      border-color: rgba(145, 192, 255, 0.32);
      background:
        radial-gradient(circle at 20% 20%, rgba(106, 216, 255, 0.28), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(228, 90, 181, 0.24), transparent 42%),
        linear-gradient(135deg, rgba(120,168,255,0.28), rgba(143,104,255,0.18));
      box-shadow:
        0 16px 34px rgba(0,0,0,0.24),
        0 0 40px rgba(120,168,255,0.16);
    }

    .result-card {
      position: relative;
      overflow: hidden;
      min-height: 560px;
      border-radius: 38px;
      background:
        radial-gradient(circle at 14% 66%, rgba(106,216,255,0.85), rgba(106,216,255,0.85) 20%, transparent 21%),
        radial-gradient(circle at 96% 62%, rgba(228,90,181,0.9), rgba(228,90,181,0.9) 18%, transparent 19%),
        radial-gradient(circle at 50% 50%, rgba(120,168,255,0.16), transparent 24%),
        linear-gradient(180deg, rgba(255,255,255,0.98), rgba(245,247,252,0.96));
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }

    .result-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 50%, rgba(120,168,255,0.16), transparent 28%);
      opacity: 0.95;
    }

    .result-inner {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 42px 28px;
      text-align: center;
    }

    .result-label {
      color: #dde3f3;
      font-size: clamp(26px, 3vw, 40px);
      font-weight: 900;
      margin-bottom: 32px;
      letter-spacing: -0.02em;
    }

    .number-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      min-width: min(100%, 980px);
      padding: 42px 54px;
      border-radius: 40px;
      background:
        radial-gradient(circle at 50% 50%, rgba(122, 160, 236, 0.92), rgba(122, 160, 236, 0.92) 46%, rgba(0,0,0,0) 47%),
        linear-gradient(90deg, #000 0%, #000 12%, rgba(124, 162, 236, 1) 12%, rgba(124, 162, 236, 1) 88%, #000 88%, #000 100%);
      box-shadow:
        0 18px 40px rgba(34, 61, 120, 0.24),
        0 0 40px rgba(120,168,255,0.22);
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .number-wrap.animate {
      transform: scale(1.015);
      filter: brightness(1.02);
    }

    .digit {
      font-size: clamp(88px, 17vw, 230px);
      line-height: 0.84;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.05em;
      text-shadow: 0 10px 24px rgba(40, 64, 130, 0.24);
      min-width: 0.56em;
      transform: translateY(0);
      opacity: 1;
      transition: transform 0.18s ease, opacity 0.18s ease;
      font-variant-numeric: tabular-nums;
    }

    .digit.rolling {
      transform: translateY(8px);
      opacity: 0.66;
    }

    .result-hint {
      margin-top: 34px;
      color: #cfd6ea;
      font-size: clamp(16px, 2vw, 28px);
      font-weight: 800;
    }

    .actions {
      display: grid;
      grid-template-columns: minmax(260px, 1.6fr) repeat(5, minmax(110px, 1fr));
      gap: 14px;
      align-items: stretch;
    }

    .primary-btn,
    .action-btn {
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      cursor: pointer;
      border-radius: 22px;
      min-height: 88px;
      font-weight: 900;
      transition: transform 0.16s ease, opacity 0.16s ease, box-shadow 0.16s ease;
      box-shadow: 0 16px 28px rgba(0,0,0,0.24);
    }

    .primary-btn {
      background:
        radial-gradient(circle at 20% 20%, rgba(106,216,255,0.36), transparent 44%),
        radial-gradient(circle at 80% 78%, rgba(228,90,181,0.34), transparent 42%),
        linear-gradient(135deg, rgba(120,168,255,0.92), rgba(143,104,255,0.92), rgba(228,90,181,0.9));
      font-size: clamp(24px, 2.2vw, 38px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .action-btn {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)),
        rgba(10, 18, 36, 0.88);
      font-size: clamp(16px, 1.4vw, 22px);
    }

    .action-btn:hover,
    .primary-btn:hover,
    .segment-btn:hover {
      opacity: 0.96;
    }

    .footer-note {
      margin-top: 18px;
      color: rgba(255,255,255,0.46);
      font-size: 13px;
      text-align: center;
      letter-spacing: 0.02em;
    }

    .hidden-capture {
      position: fixed;
      left: -99999px;
      top: -99999px;
      width: 1080px;
      height: 1920px;
      background:
        radial-gradient(circle at 12% 10%, rgba(106,216,255,0.18), transparent 22%),
        radial-gradient(circle at 88% 14%, rgba(228,90,181,0.18), transparent 22%),
        linear-gradient(180deg, #02050f 0%, #040816 35%, #071124 100%);
      padding: 54px;
      color: #fff;
      overflow: hidden;
    }

    .capture-card {
      margin-top: 34px;
      height: 1460px;
      border-radius: 42px;
      background:
        radial-gradient(circle at 14% 66%, rgba(106,216,255,0.85), rgba(106,216,255,0.85) 20%, transparent 21%),
        radial-gradient(circle at 96% 62%, rgba(228,90,181,0.9), rgba(228,90,181,0.9) 18%, transparent 19%),
        linear-gradient(180deg, rgba(255,255,255,0.98), rgba(245,247,252,0.96));
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .capture-label {
      position: absolute;
      top: 104px;
      left: 0;
      right: 0;
      text-align: center;
      color: #dde3f3;
      font-size: 62px;
      font-weight: 900;
    }

    .capture-number-wrap {
      display: inline-flex;
      gap: 34px;
      padding: 54px 74px;
      border-radius: 44px;
      background:
        radial-gradient(circle at 50% 50%, rgba(122, 160, 236, 0.92), rgba(122, 160, 236, 0.92) 46%, rgba(0,0,0,0) 47%),
        linear-gradient(90deg, #000 0%, #000 12%, rgba(124, 162, 236, 1) 12%, rgba(124, 162, 236, 1) 88%, #000 88%, #000 100%);
      box-shadow:
        0 18px 40px rgba(34, 61, 120, 0.24),
        0 0 40px rgba(120,168,255,0.22);
    }

    .capture-digit {
      font-size: 260px;
      line-height: 0.84;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.05em;
      min-width: 0.56em;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .capture-brand {
      position: absolute;
      left: 54px;
      bottom: 48px;
      color: #fff;
    }

    .capture-brand-title {
      font-size: 32px;
      font-weight: 900;
    }

    .capture-brand-date {
      font-size: 20px;
      color: rgba(255,255,255,0.76);
      margin-top: 8px;
    }

    @media (max-width: 1100px) {
      .segmented {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .actions {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .primary-btn {
        grid-column: 1 / -1;
      }

      .result-card {
        min-height: 500px;
      }

      .number-wrap {
        padding: 34px 28px;
        gap: 18px;
      }
    }

    @media (max-width: 700px) {
      .app {
        padding-left: 14px;
        padding-right: 14px;
      }

      .topbar {
        align-items: flex-start;
      }

      .brand-icon {
        width: 72px;
        height: 72px;
        border-radius: 20px;
      }

      .eyebrow {
        font-size: 15px;
      }

      .subtitle {
        font-size: 15px;
      }

      .segmented {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .segment-btn {
        height: 74px;
        border-radius: 20px;
      }

      .result-card {
        min-height: 430px;
        border-radius: 28px;
      }

      .result-inner {
        padding: 28px 18px;
      }

      .result-label {
        margin-bottom: 20px;
      }

      .number-wrap {
        min-width: 100%;
        padding: 24px 18px;
        gap: 12px;
        border-radius: 28px;
      }

      .result-hint {
        margin-top: 20px;
      }

      .actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .primary-btn {
        grid-column: 1 / -1;
        min-height: 82px;
      }

      .action-btn {
        min-height: 72px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-icon" aria-hidden="true">
        <svg width="52" height="52" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="cubeStroke" x1="10" y1="10" x2="56" y2="56" gradientUnits="userSpaceOnUse">
              <stop stop-color="#6AD8FF"/>
              <stop offset="0.5" stop-color="#8F68FF"/>
              <stop offset="1" stop-color="#E45AB5"/>
            </linearGradient>
          </defs>
          <rect x="6" y="6" width="52" height="52" rx="16" fill="#0E1630"/>
          <path d="M32 14L44.5 21.2V35.6L32 42.8L19.5 35.6V21.2L32 14Z" stroke="url(#cubeStroke)" stroke-width="3"/>
          <path d="M32 14V28.4M44.5 21.2L32 28.4M19.5 21.2L32 28.4M32 28.4V42.8" stroke="url(#cubeStroke)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="brand-text">
        <div class="eyebrow">Random 100% • ไม่เกี่ยวกับ AI</div>
        <h1 class="title">Lucky Drop</h1>
        <div class="subtitle">Pure Random • Real Luck</div>
      </div>
    </header>

    <section class="segmented" aria-label="เลือกจำนวนหลัก">
      <button class="segment-btn" data-digits="1">1 ตัว</button>
      <button class="segment-btn active" data-digits="2">2 ตัว</button>
      <button class="segment-btn" data-digits="3">3 ตัว</button>
      <button class="segment-btn" data-digits="4">4 ตัว</button>
      <button class="segment-btn" data-digits="5">5 ตัว</button>
      <button class="segment-btn" data-digits="6">6 ตัว</button>
    </section>

    <section class="result-card" id="resultCard">
      <div class="result-overlay"></div>

      <div class="result-inner">
        <div class="result-label" id="resultLabel">เลขนำโชค 2 ตัว</div>

        <div class="number-wrap" id="numberWrap" aria-live="polite">
          <span class="digit">-</span>
          <span class="digit">-</span>
        </div>

        <div class="result-hint" id="resultHint">กดสุ่มเพื่อเริ่ม</div>
      </div>
    </section>

    <section class="actions">
      <button class="primary-btn" id="randomBtn">🎲 สุ่มเลข</button>
      <button class="action-btn" id="copyBtn">Copy</button>
      <button class="action-btn" id="storyBtn">Save Story</button>
      <button class="action-btn" id="squareBtn">Save Square</button>
      <button class="action-btn" id="shareBtn">Share</button>
      <button class="action-btn" id="lineBtn">LINE</button>
    </section>

    <div class="footer-note">Lucky Random • Full Random</div>
  </main>

  <div class="hidden-capture" id="captureCanvas"></div>

  <script>
    const state = {
      digits: 2,
      value: "",
      hasResult: false
    };

    const segmentButtons = [...document.querySelectorAll(".segment-btn")];
    const resultLabel = document.getElementById("resultLabel");
    const numberWrap = document.getElementById("numberWrap");
    const resultHint = document.getElementById("resultHint");
    const resultCard = document.getElementById("resultCard");

    const randomBtn = document.getElementById("randomBtn");
    const copyBtn = document.getElementById("copyBtn");
    const storyBtn = document.getElementById("storyBtn");
    const squareBtn = document.getElementById("squareBtn");
    const shareBtn = document.getElementById("shareBtn");
    const lineBtn = document.getElementById("lineBtn");

    function padValue(value, size) {
      return String(value).padStart(size, "0").slice(-size);
    }

    function randomDigits(size) {
      let result = "";
      for (let i = 0; i < size; i += 1) {
        result += Math.floor(Math.random() * 10).toString();
      }
      return result;
    }

    function getLabel(size) {
      return `เลขนำโชค ${size} ตัว`;
    }

    function createDigitNodes(value) {
      numberWrap.innerHTML = "";
      const chars = value.split("");
      chars.forEach((char) => {
        const span = document.createElement("span");
        span.className = "digit";
        span.textContent = char;
        numberWrap.appendChild(span);
      });
    }

    function createPlaceholderNodes(size) {
      numberWrap.innerHTML = "";
      for (let i = 0; i < size; i += 1) {
        const span = document.createElement("span");
        span.className = "digit";
        span.textContent = "-";
        numberWrap.appendChild(span);
      }
    }

    function updateHeader() {
      resultLabel.textContent = getLabel(state.digits);
    }

    function setDigits(size) {
      state.digits = size;
      segmentButtons.forEach((btn) => {
        btn.classList.toggle("active", Number(btn.dataset.digits) === size);
      });
      updateHeader();

      if (!state.hasResult) {
        createPlaceholderNodes(size);
        resultHint.textContent = "กดสุ่มเพื่อเริ่ม";
        return;
      }

      const nextValue = padValue(state.value, size);
      state.value = nextValue;
      createDigitNodes(nextValue);
      resultHint.textContent = "เลขล่าสุด";
    }

    async function animateRoll(finalValue) {
      const rounds = 9;
      resultCard.classList.add("animate");

      for (let step = 0; step < rounds; step += 1) {
        const temp = randomDigits(state.digits);
        createDigitNodes(temp);
        document.querySelectorAll(".digit").forEach((el) => el.classList.add("rolling"));
        await new Promise((resolve) => setTimeout(resolve, 56 + step * 8));
      }

      createDigitNodes(finalValue);
      document.querySelectorAll(".digit").forEach((el) => el.classList.remove("rolling"));

      setTimeout(() => {
        resultCard.classList.remove("animate");
      }, 160);
    }

    async function generateNumber() {
      const value = randomDigits(state.digits);
      state.value = value;
      state.hasResult = true;
      resultHint.textContent = "เลขล่าสุด";
      await animateRoll(value);
    }

    function getResultText() {
      return state.hasResult ? state.value : "";
    }

    async function copyResult() {
      if (!state.hasResult) {
        alert("ยังไม่มีเลขให้คัดลอก");
        return;
      }

      try {
        await navigator.clipboard.writeText(state.value);
        resultHint.textContent = "คัดลอกแล้ว";
        setTimeout(() => {
          resultHint.textContent = "เลขล่าสุด";
        }, 1200);
      } catch (error) {
        alert("คัดลอกไม่สำเร็จ");
      }
    }

    function getThaiDate() {
      const now = new Date();
      const thaiYear = now.getFullYear() + 543;
      const day = now.getDate();
      const month = now.getMonth() + 1;
      return `${day}/${month}/${thaiYear}`;
    }

    function buildCaptureMarkup(size, value, mode = "story") {
      const digits = value.split("").map((char) => `<div class="capture-digit">${char}</div>`).join("");
      const height = mode === "square" ? 1080 : 1920;
      const width = 1080;
      const cardHeight = mode === "square" ? 860 : 1460;
      const cardTop = mode === "square" ? 26 : 34;
      const labelTop = mode === "square" ? 78 : 104;
      const digitSize = mode === "square" ? 210 : 260;

      return `
        <div style="width:${width}px;height:${height}px;background:
          radial-gradient(circle at 12% 10%, rgba(106,216,255,0.18), transparent 22%),
          radial-gradient(circle at 88% 14%, rgba(228,90,181,0.18), transparent 22%),
          linear-gradient(180deg, #02050f 0%, #040816 35%, #071124 100%);
          padding:54px;color:#fff;position:relative;overflow:hidden;">
          
          <div style="display:flex;align-items:center;gap:18px;">
            <div style="width:86px;height:86px;border-radius:24px;display:grid;place-items:center;
              background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)), rgba(11,18,36,0.92);
              border:1px solid rgba(255,255,255,0.08);">
              <svg width="50" height="50" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="captureCubeStroke" x1="10" y1="10" x2="56" y2="56" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#6AD8FF"/>
                    <stop offset="0.5" stop-color="#8F68FF"/>
                    <stop offset="1" stop-color="#E45AB5"/>
                  </linearGradient>
                </defs>
                <rect x="6" y="6" width="52" height="52" rx="16" fill="#0E1630"/>
                <path d="M32 14L44.5 21.2V35.6L32 42.8L19.5 35.6V21.2L32 14Z" stroke="url(#captureCubeStroke)" stroke-width="3"/>
                <path d="M32 14V28.4M44.5 21.2L32 28.4M19.5 21.2L32 28.4M32 28.4V42.8" stroke="url(#captureCubeStroke)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div>
              <div style="font-size:24px;font-weight:800;color:rgba(255,255,255,0.78);">Random 100% • ไม่เกี่ยวกับ AI</div>
              <div style="font-size:68px;line-height:0.95;font-weight:900;letter-spacing:-0.04em;">Lucky Drop</div>
              <div style="font-size:28px;font-weight:800;color:#d7dff0;margin-top:8px;">Pure Random • Real Luck</div>
            </div>
          </div>

          <div style="
            margin-top:${cardTop}px;
            height:${cardHeight}px;
            border-radius:42px;
            background:
              radial-gradient(circle at 14% 66%, rgba(106,216,255,0.85), rgba(106,216,255,0.85) 20%, transparent 21%),
              radial-gradient(circle at 96% 62%, rgba(228,90,181,0.9), rgba(228,90,181,0.9) 18%, transparent 19%),
              linear-gradient(180deg, rgba(255,255,255,0.98), rgba(245,247,252,0.96));
            position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;">
            
            <div style="
              position:absolute;
              top:${labelTop}px;
              left:0;
              right:0;
              text-align:center;
              color:#dde3f3;
              font-size:${mode === "square" ? 50 : 62}px;
              font-weight:900;">
              เลขนำโชค ${size} ตัว
            </div>

            <div style="
              display:inline-flex;
              gap:${mode === "square" ? 22 : 34}px;
              padding:${mode === "square" ? "44px 54px" : "54px 74px"};
              border-radius:44px;
              background:
                radial-gradient(circle at 50% 50%, rgba(122,160,236,0.92), rgba(122,160,236,0.92) 46%, rgba(0,0,0,0) 47%),
                linear-gradient(90deg, #000 0%, #000 12%, rgba(124,162,236,1) 12%, rgba(124,162,236,1) 88%, #000 88%, #000 100%);
              box-shadow:
                0 18px 40px rgba(34,61,120,0.24),
                0 0 40px rgba(120,168,255,0.22);">
              ${value.split("").map((char) => `
                <div style="
                  font-size:${digitSize}px;
                  line-height:0.84;
                  font-weight:900;
                  color:#fff;
                  letter-spacing:-0.05em;
                  min-width:0.56em;
                  text-align:center;
                  font-variant-numeric:tabular-nums;">${char}</div>
              `).join("")}
            </div>

            <div style="
              position:absolute;
              left:54px;
              bottom:48px;
              color:#fff;">
              <div style="font-size:32px;font-weight:900;">Lucky Random • Full Random</div>
              <div style="font-size:20px;color:rgba(255,255,255,0.76);margin-top:8px;">${getThaiDate()}</div>
            </div>
          </div>
        </div>
      `;
    }

    async function domToImageDownload(mode = "story") {
      if (!state.hasResult) {
        alert("ยังไม่มีเลขให้บันทึก");
        return;
      }

      const target = document.getElementById("captureCanvas");
      target.innerHTML = buildCaptureMarkup(state.digits, state.value, mode);

      try {
        const svg = `
          <svg xmlns="http://www.w3.org/2000/svg" width="${mode === "square" ? 1080 : 1080}" height="${mode === "square" ? 1080 : 1920}">
            <foreignObject width="100%" height="100%">
              <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;">
                ${target.innerHTML}
              </div>
            </foreignObject>
          </svg>
        `;

        const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(blob);

        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = mode === "square" ? 1080 : 1080;
          canvas.height = mode === "square" ? 1080 : 1920;

          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#040816";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);

          URL.revokeObjectURL(url);

          const link = document.createElement("a");
          link.download = `lucky-drop-${mode}-${state.value}.png`;
          link.href = canvas.toDataURL("image/png");
          link.click();
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          alert("บันทึกภาพไม่สำเร็จ");
        };
        img.src = url;
      } catch (error) {
        alert("บันทึกภาพไม่สำเร็จ");
      }
    }

    async function shareResult() {
      if (!state.hasResult) {
        alert("ยังไม่มีเลขให้แชร์");
        return;
      }

      const text = `Lucky Drop\nเลขนำโชค ${state.digits} ตัว: ${state.value}`;

      if (navigator.share) {
        try {
          await navigator.share({
            title: "Lucky Drop",
            text
          });
          return;
        } catch (error) {}
      }

      try {
        await navigator.clipboard.writeText(text);
        alert("คัดลอกข้อความสำหรับแชร์แล้ว");
      } catch (error) {
        alert(text);
      }
    }

    function openLineShare() {
      if (!state.hasResult) {
        alert("ยังไม่มีเลขให้แชร์");
        return;
      }

      const text = encodeURIComponent(`Lucky Drop\nเลขนำโชค ${state.digits} ตัว: ${state.value}`);
      window.open(`https://social-plugins.line.me/lineit/share?text=${text}`, "_blank");
    }

    segmentButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        setDigits(Number(btn.dataset.digits));
      });
    });

    randomBtn.addEventListener("click", generateNumber);
    copyBtn.addEventListener("click", copyResult);
    storyBtn.addEventListener("click", () => domToImageDownload("story"));
    squareBtn.addEventListener("click", () => domToImageDownload("square"));
    shareBtn.addEventListener("click", shareResult);
    lineBtn.addEventListener("click", openLineShare);

    updateHeader();
    createPlaceholderNodes(state.digits);
  </script>
</body>
</html>
