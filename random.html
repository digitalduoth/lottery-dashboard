<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />
  <title>Lucky Drop</title>

  <meta name="theme-color" content="#050816" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />

  <style>
    :root {
      --bg: #040814;
      --bg-2: #071126;
      --panel: rgba(10, 18, 36, 0.88);
      --panel-soft: rgba(255, 255, 255, 0.03);
      --line: rgba(255, 255, 255, 0.08);

      --text: #f8fbff;
      --muted: #a6b2ca;

      --cyan: #78d8ff;
      --blue: #82a8ff;
      --purple: #8d6aff;
      --pink: #d957aa;
      --green: #2dd36f;

      --shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
      --radius-xl: 34px;
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 12% 10%, rgba(120, 216, 255, 0.18), transparent 20%),
        radial-gradient(circle at 88% 14%, rgba(217, 87, 170, 0.18), transparent 18%),
        radial-gradient(circle at 50% 100%, rgba(130, 168, 255, 0.10), transparent 24%),
        linear-gradient(180deg, #02050d 0%, var(--bg) 38%, var(--bg-2) 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Arial, sans-serif;
      overflow-x: hidden;
    }

    body {
      user-select: none;
    }

    .app {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      padding:
        max(20px, env(safe-area-inset-top))
        18px
        max(24px, env(safe-area-inset-bottom))
        18px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .logo-box {
      width: 86px;
      height: 86px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)),
        rgba(11, 18, 36, 0.94);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 18px 36px rgba(0,0,0,0.34),
        0 0 34px rgba(141,106,255,0.16);
    }

    .brand {
      min-width: 0;
    }

    .eyebrow {
      color: rgba(255,255,255,0.76);
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .title {
      margin: 0;
      font-size: clamp(44px, 8vw, 88px);
      line-height: 0.95;
      letter-spacing: -0.04em;
      font-weight: 900;
    }

    .subtitle {
      margin-top: 10px;
      color: #d7dff0;
      font-size: clamp(16px, 2vw, 22px);
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 14px;
      margin: 22px 0 20px;
    }

    .segment-btn {
      height: 88px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.10);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)),
        rgba(10, 18, 36, 0.88);
      color: #fff;
      font-size: clamp(18px, 2vw, 26px);
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.16s ease, opacity 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .segment-btn:hover,
    .primary-btn:hover,
    .action-btn:hover {
      opacity: 0.96;
    }

    .segment-btn:active,
    .primary-btn:active,
    .action-btn:active {
      transform: scale(0.98);
    }

    .segment-btn.active {
      border-color: rgba(141, 182, 255, 0.28);
      background:
        radial-gradient(circle at 20% 18%, rgba(120,216,255,0.26), transparent 44%),
        radial-gradient(circle at 80% 78%, rgba(217,87,170,0.24), transparent 42%),
        linear-gradient(135deg, rgba(130,168,255,0.20), rgba(141,106,255,0.18));
      box-shadow:
        0 14px 28px rgba(0,0,0,0.22),
        0 0 34px rgba(120,168,255,0.12);
    }

    .result-card {
      position: relative;
      overflow: hidden;
      min-height: 540px;
      border-radius: 38px;
      background:
        radial-gradient(circle at 10% 78%, rgba(120,216,255,0.18), transparent 18%),
        radial-gradient(circle at 90% 20%, rgba(217,87,170,0.16), transparent 16%),
        linear-gradient(180deg, rgba(8,16,30,0.96), rgba(6,12,24,0.98));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }

    .result-inner {
      position: relative;
      width: 100%;
      padding: 34px 22px 28px;
      text-align: center;
      z-index: 2;
    }

    .result-label {
      color: #f2f6ff;
      font-size: clamp(24px, 3vw, 40px);
      font-weight: 900;
      margin-bottom: 28px;
      letter-spacing: -0.02em;
    }

    .number-stage {
      position: relative;
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 32px 18px;
      border-radius: 34px;
      background:
        radial-gradient(circle at 50% 50%, rgba(123, 157, 228, 0.16), transparent 26%),
        linear-gradient(180deg, rgba(0,0,0,0.92), rgba(4,8,18,0.98));
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.03),
        0 0 34px rgba(120,168,255,0.12);
    }

    .number-track {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      min-width: min(100%, 920px);
      padding: 34px 38px;
      border-radius: 38px;
      background:
        radial-gradient(circle at 50% 50%, rgba(126, 158, 230, 0.95), rgba(126, 158, 230, 0.95) 38%, transparent 39%),
        linear-gradient(90deg, #000 0%, #000 14%, rgba(124, 160, 236, 1) 14%, rgba(124, 160, 236, 1) 86%, #000 86%, #000 100%);
      box-shadow:
        0 18px 42px rgba(31, 55, 120, 0.28),
        0 0 42px rgba(120,168,255,0.22);
      transition: transform 0.22s ease, filter 0.22s ease;
    }

    .number-track.spin {
      transform: scale(1.018);
      filter: brightness(1.04);
    }

    .digit {
      min-width: 0.6em;
      text-align: center;
      color: #ffffff;
      font-size: clamp(92px, 18vw, 230px);
      line-height: 0.84;
      font-weight: 900;
      letter-spacing: -0.06em;
      text-shadow: 0 10px 24px rgba(40, 64, 130, 0.22);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Arial Black", "Segoe UI", sans-serif;
      font-variant-numeric: tabular-nums;
      transition: transform 0.14s ease, opacity 0.14s ease;
    }

    .digit.rolling {
      transform: translateY(8px) scale(0.98);
      opacity: 0.64;
    }

    .result-hint {
      margin-top: 22px;
      color: #dbe4f8;
      font-size: clamp(16px, 2vw, 24px);
      font-weight: 800;
    }

    .actions {
      display: grid;
      grid-template-columns: minmax(260px, 1.6fr) repeat(5, minmax(110px, 1fr));
      gap: 14px;
      align-items: stretch;
    }

    .primary-btn,
    .action-btn {
      min-height: 84px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.10);
      color: #fff;
      cursor: pointer;
      font-weight: 900;
      box-shadow: 0 16px 28px rgba(0,0,0,0.22);
      transition: transform 0.16s ease, opacity 0.16s ease;
    }

    .primary-btn {
      background:
        radial-gradient(circle at 20% 20%, rgba(120,216,255,0.26), transparent 44%),
        radial-gradient(circle at 80% 78%, rgba(217,87,170,0.24), transparent 42%),
        linear-gradient(135deg, rgba(130,168,255,0.98), rgba(141,106,255,0.96), rgba(217,87,170,0.92));
      font-size: clamp(24px, 2.2vw, 38px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .action-btn {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)),
        rgba(10, 18, 36, 0.90);
      font-size: clamp(16px, 1.4vw, 22px);
    }

    .footer-note {
      margin-top: 18px;
      color: rgba(255,255,255,0.46);
      font-size: 13px;
      text-align: center;
      letter-spacing: 0.02em;
    }

    @media (max-width: 1100px) {
      .segmented {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .actions {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .primary-btn {
        grid-column: 1 / -1;
      }

      .result-card {
        min-height: 470px;
      }
    }

    @media (max-width: 700px) {
      .app {
        padding-left: 14px;
        padding-right: 14px;
      }

      .logo-box {
        width: 72px;
        height: 72px;
        border-radius: 20px;
      }

      .eyebrow {
        font-size: 15px;
      }

      .subtitle {
        font-size: 15px;
      }

      .segmented {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .segment-btn {
        height: 74px;
        border-radius: 20px;
      }

      .result-card {
        min-height: 400px;
        border-radius: 28px;
      }

      .result-inner {
        padding: 26px 16px 22px;
      }

      .number-stage {
        padding: 20px 12px;
        border-radius: 24px;
      }

      .number-track {
        min-width: 100%;
        padding: 24px 16px;
        gap: 10px;
        border-radius: 26px;
      }

      .actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .primary-btn {
        grid-column: 1 / -1;
        min-height: 80px;
      }

      .action-btn {
        min-height: 70px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="logo-box" aria-hidden="true">
        <svg width="52" height="52" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="cubeStroke" x1="10" y1="10" x2="56" y2="56" gradientUnits="userSpaceOnUse">
              <stop stop-color="#78D8FF"/>
              <stop offset="0.5" stop-color="#8D6AFF"/>
              <stop offset="1" stop-color="#D957AA"/>
            </linearGradient>
          </defs>
          <rect x="6" y="6" width="52" height="52" rx="16" fill="#0E1630"/>
          <path d="M32 14L44.5 21.2V35.6L32 42.8L19.5 35.6V21.2L32 14Z" stroke="url(#cubeStroke)" stroke-width="3"/>
          <path d="M32 14V28.4M44.5 21.2L32 28.4M19.5 21.2L32 28.4M32 28.4V42.8" stroke="url(#cubeStroke)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="brand">
        <div class="eyebrow">Random 100% • ไม่เกี่ยวกับ AI</div>
        <h1 class="title">Lucky Drop</h1>
        <div class="subtitle">Pure Random • Real Luck</div>
      </div>
    </header>

    <section class="segmented" aria-label="เลือกจำนวนหลัก">
      <button class="segment-btn" data-digits="1">1 ตัว</button>
      <button class="segment-btn active" data-digits="2">2 ตัว</button>
      <button class="segment-btn" data-digits="3">3 ตัว</button>
      <button class="segment-btn" data-digits="4">4 ตัว</button>
      <button class="segment-btn" data-digits="5">5 ตัว</button>
      <button class="segment-btn" data-digits="6">6 ตัว</button>
    </section>

    <section class="result-card" id="resultCard">
      <div class="result-inner">
        <div class="result-label" id="resultLabel">เลขนำโชค 2 ตัว</div>

        <div class="number-stage">
          <div class="number-track" id="numberTrack" aria-live="polite">
            <span class="digit">-</span>
            <span class="digit">-</span>
          </div>
        </div>

        <div class="result-hint" id="resultHint">กดสุ่มเพื่อเริ่ม</div>
      </div>
    </section>

    <section class="actions">
      <button class="primary-btn" id="randomBtn">🎲 สุ่มเลข</button>
      <button class="action-btn" id="copyBtn">Copy</button>
      <button class="action-btn" id="storyBtn">Save Story</button>
      <button class="action-btn" id="squareBtn">Save Square</button>
      <button class="action-btn" id="shareBtn">Share</button>
      <button class="action-btn" id="lineBtn">LINE</button>
    </section>

    <div class="footer-note">Lucky Random • Full Random</div>
  </main>

  <script>
    const state = {
      digits: 2,
      value: "",
      hasResult: false,
      spinning: false
    };

    const segmentButtons = [...document.querySelectorAll(".segment-btn")];
    const resultLabel = document.getElementById("resultLabel");
    const numberTrack = document.getElementById("numberTrack");
    const resultHint = document.getElementById("resultHint");
    const resultCard = document.getElementById("resultCard");

    const randomBtn = document.getElementById("randomBtn");
    const copyBtn = document.getElementById("copyBtn");
    const storyBtn = document.getElementById("storyBtn");
    const squareBtn = document.getElementById("squareBtn");
    const shareBtn = document.getElementById("shareBtn");
    const lineBtn = document.getElementById("lineBtn");

    function randomDigits(size) {
      let out = "";
      for (let i = 0; i < size; i += 1) {
        out += Math.floor(Math.random() * 10).toString();
      }
      return out;
    }

    function getLabel(size) {
      return `เลขนำโชค ${size} ตัว`;
    }

    function createDigits(value) {
      numberTrack.innerHTML = "";
      value.split("").forEach((char) => {
        const span = document.createElement("span");
        span.className = "digit";
        span.textContent = char;
        numberTrack.appendChild(span);
      });
    }

    function createPlaceholder(size) {
      numberTrack.innerHTML = "";
      for (let i = 0; i < size; i += 1) {
        const span = document.createElement("span");
        span.className = "digit";
        span.textContent = "-";
        numberTrack.appendChild(span);
      }
    }

    function updateLabel() {
      resultLabel.textContent = getLabel(state.digits);
    }

    function setDigits(size) {
      if (state.spinning) return;

      state.digits = size;
      segmentButtons.forEach((btn) => {
        btn.classList.toggle("active", Number(btn.dataset.digits) === size);
      });

      updateLabel();

      if (!state.hasResult) {
        createPlaceholder(size);
        resultHint.textContent = "กดสุ่มเพื่อเริ่ม";
        return;
      }

      state.value = randomDigits(size);
      createDigits(state.value);
      resultHint.textContent = "เลขล่าสุด";
    }

    async function animateSpin(finalValue) {
      state.spinning = true;
      randomBtn.disabled = true;
      numberTrack.classList.add("spin");

      const totalRounds = 18;
      const baseDelay = 55;

      for (let i = 0; i < totalRounds; i += 1) {
        createDigits(randomDigits(state.digits));
        [...numberTrack.querySelectorAll(".digit")].forEach((el) => {
          el.classList.add("rolling");
        });

        const delay = baseDelay + i * 8;
        await new Promise((resolve) => setTimeout(resolve, delay));
      }

      createDigits(finalValue);
      [...numberTrack.querySelectorAll(".digit")].forEach((el) => {
        el.classList.remove("rolling");
      });

      await new Promise((resolve) => setTimeout(resolve, 140));
      numberTrack.classList.remove("spin");
      randomBtn.disabled = false;
      state.spinning = false;
    }

    async function generateNumber() {
      if (state.spinning) return;

      const value = randomDigits(state.digits);
      state.value = value;
      state.hasResult = true;
      resultHint.textContent = "เลขล่าสุด";
      await animateSpin(value);
    }

    async function copyResult() {
      if (!state.hasResult) {
        alert("ยังไม่มีเลขให้คัดลอก");
        return;
      }

      try {
        await navigator.clipboard.writeText(state.value);
        resultHint.textContent = "คัดลอกแล้ว";
        setTimeout(() => {
          resultHint.textContent = "เลขล่าสุด";
        }, 1000);
      } catch (error) {
        alert("คัดลอกไม่สำเร็จ");
      }
    }

    function formatThaiDate() {
      const now = new Date();
      const thaiYear = now.getFullYear() + 543;
      const day = now.getDate();
      const month = now.getMonth() + 1;
      return `${day}/${month}/${thaiYear}`;
    }

    function drawBackground(ctx, width, height) {
      const bg = ctx.createLinearGradient(0, 0, 0, height);
      bg.addColorStop(0, "#02050d");
      bg.addColorStop(0.45, "#040814");
      bg.addColorStop(1, "#071126");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, width, height);

      ctx.globalAlpha = 0.18;
      ctx.fillStyle = "#78d8ff";
      ctx.beginPath();
      ctx.arc(width * 0.1, height * 0.14, width * 0.18, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#d957aa";
      ctx.beginPath();
      ctx.arc(width * 0.88, height * 0.16, width * 0.13, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = 1;
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawCard(ctx, x, y, w, h) {
      ctx.save();
      roundRect(ctx, x, y, w, h, 42);
      ctx.clip();

      const cardGrad = ctx.createLinearGradient(0, y, 0, y + h);
      cardGrad.addColorStop(0, "#08101e");
      cardGrad.addColorStop(1, "#060c18");
      ctx.fillStyle = cardGrad;
      ctx.fillRect(x, y, w, h);

      ctx.globalAlpha = 0.15;
      ctx.fillStyle = "#78d8ff";
      ctx.beginPath();
      ctx.arc(x + 120, y + h - 120, 130, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#d957aa";
      ctx.beginPath();
      ctx.arc(x + w - 110, y + 110, 100, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.restore();

      ctx.strokeStyle = "rgba(255,255,255,0.08)";
      ctx.lineWidth = 2;
      roundRect(ctx, x, y, w, h, 42);
      ctx.stroke();
    }

    function drawResultImage(mode) {
      if (!state.hasResult) {
        alert("ยังไม่มีเลขให้บันทึก");
        return;
      }

      const isSquare = mode === "square";
      const width = 1080;
      const height = isSquare ? 1080 : 1920;
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");

      drawBackground(ctx, width, height);

      ctx.fillStyle = "#ffffff";
      ctx.font = "800 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
      ctx.fillText("Random 100% • ไม่เกี่ยวกับ AI", 70, 86);

      ctx.font = "900 76px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
      ctx.fillText("Lucky Drop", 70, 162);

      ctx.fillStyle = "#d7dff0";
      ctx.font = "800 34px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
      ctx.fillText("Pure Random • Real Luck", 70, 212);

      const cardX = 54;
      const cardY = isSquare ? 250 : 310;
      const cardW = width - 108;
      const cardH = isSquare ? 720 : 1280;
      drawCard(ctx, cardX, cardY, cardW, cardH);

      ctx.fillStyle = "#f3f6ff";
      ctx.textAlign = "center";
      ctx.font = `900 ${isSquare ? 54 : 62}px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif`;
      ctx.fillText(`เลขนำโชค ${state.digits} ตัว`, width / 2, cardY + 110);

      const trackX = cardX + 60;
      const trackY = isSquare ? cardY + 190 : cardY + 320;
      const trackW = cardW - 120;
      const trackH = isSquare ? 220 : 280;

      ctx.save();
      roundRect(ctx, trackX, trackY, trackW, trackH, 34);
      ctx.clip();

      const trackGrad = ctx.createLinearGradient(trackX, trackY, trackX, trackY + trackH);
      trackGrad.addColorStop(0, "#000000");
      trackGrad.addColorStop(1, "#040812");
      ctx.fillStyle = trackGrad;
      ctx.fillRect(trackX, trackY, trackW, trackH);

      const circleX = trackX + trackW / 2;
      const circleY = trackY + trackH / 2;
      const circleR = isSquare ? 190 : 235;
      ctx.fillStyle = "#819dea";
      ctx.beginPath();
      ctx.arc(circleX, circleY, circleR, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      ctx.fillStyle = "#ffffff";
      ctx.textBaseline = "middle";
      ctx.textAlign = "center";
      ctx.font = `900 ${isSquare ? 170 : 220}px -apple-system, BlinkMacSystemFont, 'Arial Black', sans-serif`;

      const chars = state.value.split("");
      const gap = isSquare ? 120 : 150;
      const startX = width / 2 - ((chars.length - 1) * gap) / 2;

      chars.forEach((char, index) => {
        ctx.fillText(char, startX + index * gap, trackY + trackH / 2 + 10);
      });

      ctx.fillStyle = "#dbe4f8";
      ctx.font = `800 ${isSquare ? 34 : 40}px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif`;
      ctx.fillText("เลขล่าสุด", width / 2, trackY + trackH + (isSquare ? 70 : 90));

      ctx.textAlign = "left";
      ctx.fillStyle = "rgba(255,255,255,0.86)";
      ctx.font = "900 34px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
      ctx.fillText("Lucky Random • Full Random", 70, height - 90);

      ctx.fillStyle = "rgba(255,255,255,0.64)";
      ctx.font = "700 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
      ctx.fillText(formatThaiDate(), 70, height - 48);

      const link = document.createElement("a");
      link.download = `lucky-drop-${mode}-${state.value}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    async function shareResult() {
      if (!state.hasResult) {
        alert("ยังไม่มีเลขให้แชร์");
        return;
      }

      const text = `Lucky Drop\nเลขนำโชค ${state.digits} ตัว: ${state.value}`;

      if (navigator.share) {
        try {
          await navigator.share({
            title: "Lucky Drop",
            text
          });
          return;
        } catch (error) {}
      }

      try {
        await navigator.clipboard.writeText(text);
        alert("คัดลอกข้อความสำหรับแชร์แล้ว");
      } catch (error) {
        alert(text);
      }
    }

    function shareToLine() {
      if (!state.hasResult) {
        alert("ยังไม่มีเลขให้แชร์");
        return;
      }

      const text = encodeURIComponent(`Lucky Drop - เลขนำโชค ${state.digits} ตัว: ${state.value}`);
      const mobileUrl = `line://msg/text/${text}`;
      const fallbackUrl = `https://line.me/R/msg/text/?${text}`;

      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      if (isMobile) {
        window.location.href = mobileUrl;
        setTimeout(() => {
          window.location.href = fallbackUrl;
        }, 900);
      } else {
        window.open(fallbackUrl, "_blank");
      }
    }

    segmentButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        setDigits(Number(btn.dataset.digits));
      });
    });

    randomBtn.addEventListener("click", generateNumber);
    copyBtn.addEventListener("click", copyResult);
    storyBtn.addEventListener("click", () => drawResultImage("story"));
    squareBtn.addEventListener("click", () => drawResultImage("square"));
    shareBtn.addEventListener("click", shareResult);
    lineBtn.addEventListener("click", shareToLine);

    updateLabel();
    createPlaceholder(state.digits);
  </script>
</body>
</html>
